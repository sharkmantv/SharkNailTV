name: Design 02 actual Android preview
on:
  push:
    branches: ['design/holding-icons-02-preview']
    paths: ['app/src/main/assets/design2_home.png']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: shark-sky-design02-preview
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: SDK
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f -print -quit)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Verify selected design artwork
        run: |
          python3 - <<'PY'
          import struct, hashlib
          p='app/src/main/res/drawable-nodpi/premium_mockup3.png'
          b=open(p,'rb').read()
          assert b[:8]==b'\x89PNG\r\n\x1a\n'
          assert struct.unpack('>II',b[16:24])==(1400,1000)
          assert hashlib.sha1(('blob '+str(len(b))+'\0').encode()+b).hexdigest()=='87bbc44733b971a95a8937faee04f2b55876ff43'
          print('PASS: exact approved artwork')
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate and verify transparent PNG symbols
        run: |
          python -m pip install Pillow==11.3.0 fonttools==4.59.2
          python ci/prepare_sky_font.py
          python ci/prepare_design2.py
          python ci/extract_premium_art.py
          echo '8b93640d45757966232af87dafbbc0d4dcfe11e9a05bd9f3143a7c609b6e50ba  app/src/main/res/drawable-nodpi/four_sharks_atlas.png' | sha256sum -c -
          python -c "from PIL import Image; im=Image.open('app/src/main/res/drawable-nodpi/four_sharks_atlas.png'); assert im.mode=='RGBA' and im.size==(1672,941) and im.getchannel('A').getextrema()==(0,255)"
      - name: Build and verify exact-beta FFmpeg audio extension
        run: bash ci/build_ffmpeg_beta.sh
      - name: Compile
        run: gradle --no-daemon :app:assembleRelease
      - name: Sign and verify
        env:
          SHARK_SIGNING_BUNDLE: ${{ secrets.SHARK_SIGNING_BUNDLE }}
          SHARK_KEYSTORE_B64: ${{ secrets.SHARK_KEYSTORE_B64 }}
          SHARK_KEYSTORE_PASSWORD: ${{ secrets.SHARK_KEYSTORE_PASSWORD }}
          SHARK_KEY_ALIAS: ${{ secrets.SHARK_KEY_ALIAS }}
          SHARK_KEY_PASSWORD: ${{ secrets.SHARK_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          export KS="$RUNNER_TEMP/shark-key"
          if [[ -n "$SHARK_SIGNING_BUNDLE" ]]; then
            SHARK_KEYSTORE_PASSWORD=$(python - <<'PY'
          import os,json,base64
          from pathlib import Path
          b=json.loads(os.environ["SHARK_SIGNING_BUNDLE"].strip(),strict=False)
          Path(os.environ["KS"]).write_bytes(base64.b64decode(''.join(b["keystore"].split()),validate=True))
          print(''.join(b["password"].split()))
          PY
            )
            echo "::add-mask::$SHARK_KEYSTORE_PASSWORD"
            export SHARK_KEYSTORE_PASSWORD
            export SHARK_KEY_PASSWORD="$SHARK_KEYSTORE_PASSWORD"
            export SHARK_KEY_ALIAS=sharknailtv
          else
            printf '%s' "${SHARK_KEYSTORE_B64:?Missing signing key}" | base64 -d > "$KS"
          fi
          tools="$ANDROID_HOME/build-tools/36.0.0"
          "$tools/zipalign" -P 16 -f 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" sign --ks "$KS" --ks-key-alias "$SHARK_KEY_ALIAS" --ks-pass env:SHARK_KEYSTORE_PASSWORD --key-pass env:SHARK_KEY_PASSWORD --out SharkNailTV.apk "$RUNNER_TEMP/aligned.apk"
          cert=$("$tools/apksigner" verify --print-certs SharkNailTV.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          test "$cert" = '14fea534b29f1196c0a2fcb0618cde8f6391ad6e9153a941fd8c86e3cb0fca96'
          "$tools/aapt" dump badging SharkNailTV.apk | grep -F "package: name='com.example.xtreamtv' versionCode='50032'"
          unzip -tq SharkNailTV.apk
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            unzip -l SharkNailTV.apk | grep -F "lib/$abi/libffmpegJNI.so"
          done
          rm -f "$KS"
      - uses: actions/upload-artifact@v4
        with:
          name: Design02-preview-candidate-install-untested
          path: SharkNailTV.apk
          if-no-files-found: error
      - name: Fetch last published APK for upgrade test
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download v5.0.26 --repo "$GITHUB_REPOSITORY" --pattern SharkNailTV.apk --output "$RUNNER_TEMP/previous.apk"
          tools="$ANDROID_HOME/build-tools/36.0.0"
          previous_cert=$("$tools/apksigner" verify --print-certs "$RUNNER_TEMP/previous.apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          test "$previous_cert" = '14fea534b29f1196c0a2fcb0618cde8f6391ad6e9153a941fd8c86e3cb0fca96'
          "$tools/aapt" dump badging "$RUNNER_TEMP/previous.apk" | grep -F "package: name='com.example.xtreamtv' versionCode='50026'"
      - name: Retrieve published 5.0.31 APK for upgrade test
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/prior31"
          gh release download v5.0.31 --repo "$GITHUB_REPOSITORY" --pattern SharkNailTV.apk --output "$RUNNER_TEMP/prior31/SharkNailTV.apk"
          tools="$ANDROID_HOME/build-tools/36.0.0"
          cert=$("$tools/apksigner" verify --print-certs "$RUNNER_TEMP/prior31/SharkNailTV.apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          test "$cert" = '14fea534b29f1196c0a2fcb0618cde8f6391ad6e9153a941fd8c86e3cb0fca96'
          "$tools/aapt" dump badging "$RUNNER_TEMP/prior31/SharkNailTV.apk" | grep -F "package: name='com.example.xtreamtv' versionCode='50031'"
      - name: Prepare emulator acceleration
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod a+rw /dev/kvm
          fi
      - name: Emulator smoke test
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_I_WANT_MY_TCG: "yes"
        with:
          api-level: 35
          emulator-boot-timeout: 1200
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            set -e
            adb shell settings put secure immersive_mode_confirmations confirmed
            adb shell wm size 1920x1080
            adb shell wm density 320
            adb shell input keyevent KEYCODE_WAKEUP
            adb shell wm dismiss-keyguard
            adb install "$RUNNER_TEMP/previous.apk"
            adb shell am start -W -n com.example.xtreamtv/.MainActivity
            adb shell pidof com.example.xtreamtv
            adb install -r "$RUNNER_TEMP/prior31/SharkNailTV.apk"
            adb shell dumpsys package com.example.xtreamtv | grep -F 'versionCode=50031'
            adb install -r SharkNailTV.apk
            adb shell am force-stop com.google.android.apps.nexuslauncher
            adb shell am force-stop com.example.xtreamtv
            adb logcat -c
            adb shell am start -W -n com.example.xtreamtv/.MainActivity
            sleep 5
            adb shell pidof com.example.xtreamtv
            adb shell dumpsys package com.example.xtreamtv | grep -F 'versionCode=50032'
            adb exec-out screencap -p > premium-home-preview.png
            python3 ci/check_design2.py
            adb logcat -d -s AndroidRuntime:E > "$RUNNER_TEMP/shark-crash.log"
            if grep -F 'Process: com.example.xtreamtv,' "$RUNNER_TEMP/shark-crash.log"; then exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: Design02-preview-signed
          path: |
            SharkNailTV.apk
            ffmpeg-source.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Design02-preview-home-preview
          path: |
            premium-home-preview.png
            design02-focus-*.png
          if-no-files-found: ignore
