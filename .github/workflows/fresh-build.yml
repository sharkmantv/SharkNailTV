name: Shark Sky manual APK candidate
on:
  push:
    branches: ['design/player-glass-refinement']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: shark-sky-player-glass-5054
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-read-only: false
      - name: Test automatic refresh-rate policy
        run: |
          mkdir -p "$RUNNER_TEMP/refresh-tests"
          javac -d "$RUNNER_TEMP/refresh-tests" app/src/main/java/com/example/xtreamtv/RefreshMatch.java ci/RefreshMatchTest.java
          java -cp "$RUNNER_TEMP/refresh-tests" com.example.xtreamtv.RefreshMatchTest
      - name: SDK
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f -print -quit)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Verify selected design artwork
        run: |
          python3 - <<'PY'
          import struct, hashlib
          p='app/src/main/res/drawable-nodpi/premium_mockup3.png'
          b=open(p,'rb').read()
          assert b[:8]==b'\x89PNG\r\n\x1a\n'
          assert struct.unpack('>II',b[16:24])==(1400,1000)
          assert hashlib.sha1(('blob '+str(len(b))+'\0').encode()+b).hexdigest()=='87bbc44733b971a95a8937faee04f2b55876ff43'
          print('PASS: exact approved artwork')
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore exact pinned FFmpeg outputs
        id: ffmpeg-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            app/libs/media3-ffmpeg-1.12.0-rc01.aar
            app/src/main/assets/licenses/FFmpeg-LGPL-2.1.txt
            app/src/main/assets/licenses/Media3-Apache-2.0.txt
            app/src/main/assets/licenses/FFmpeg-NOTICE.txt
            ffmpeg-source.tar.gz
            ffmpeg-cache.sha256
          key: ffmpeg-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ci/build_ffmpeg_beta.sh') }}
      - name: Build matching Media3 RC FFmpeg audio extension on cache miss
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: |
          bash ci/build_ffmpeg_beta.sh
          sha256sum app/libs/media3-ffmpeg-1.12.0-rc01.aar app/src/main/assets/licenses/FFmpeg-LGPL-2.1.txt app/src/main/assets/licenses/Media3-Apache-2.0.txt app/src/main/assets/licenses/FFmpeg-NOTICE.txt ffmpeg-source.tar.gz > ffmpeg-cache.sha256
      - name: Verify FFmpeg integrity and all native ABIs
        run: |
          set -euo pipefail
          sha256sum -c ffmpeg-cache.sha256
          tar -tzf ffmpeg-source.tar.gz > /dev/null
          aar=app/libs/media3-ffmpeg-1.12.0-rc01.aar
          unzip -tq "$aar"
          tmp=$(mktemp -d)
          unzip -q "$aar" -d "$tmp"
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            test -s "$tmp/jni/$abi/libffmpegJNI.so"
          done
          for abi in arm64-v8a x86_64; do
            align=$(readelf -lW "$tmp/jni/$abi/libffmpegJNI.so" | awk '$1=="LOAD"{print $NF}')
            test -n "$align"
            if grep -qv '^0x4000$' <<<"$align"; then exit 1; fi
          done
          rm -rf "$tmp"
      - name: Save verified FFmpeg outputs
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            app/libs/media3-ffmpeg-1.12.0-rc01.aar
            app/src/main/assets/licenses/FFmpeg-LGPL-2.1.txt
            app/src/main/assets/licenses/Media3-Apache-2.0.txt
            app/src/main/assets/licenses/FFmpeg-NOTICE.txt
            ffmpeg-source.tar.gz
            ffmpeg-cache.sha256
          key: ${{ steps.ffmpeg-cache.outputs.cache-primary-key }}
      - name: Retrieve verified open-source UHD artwork
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run=45769076206
          gh run view "$run" --repo "$GITHUB_REPOSITORY" --json headSha,headBranch | jq -e '.headSha=="d79b2bc6497e5d380f718826e1977f36fb2bc91c" and .headBranch=="artwork/realesrgan-4k"'
          timeout 95m gh run watch "$run" --repo "$GITHUB_REPOSITORY" --exit-status --interval 30
          gh run view "$run" --repo "$GITHUB_REPOSITORY" --json conclusion | jq -e '.conclusion=="success"'
          gh run download "$run" --repo "$GITHUB_REPOSITORY" --name Sky-Shark-AI-enhanced-4K --dir enhanced-artwork
          test -s enhanced-artwork/verification.json
          test -s enhanced-artwork/comparison.png
      - name: Restore exact enhanced player artwork
        id: artwork-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            app/src/main/res/drawable-nodpi/design4_player_header.png
            app/src/main/res/drawable-nodpi/design4_player_dock.png
            app/src/main/res/drawable-nodpi/design4_player_key.png
            app/src/main/res/drawable-nodpi/design4_info_panel.png
            design4-artwork-verification.json
          key: player-approved-ai-x2-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ci/prepare_design4_player.py', 'ci/artwork/sky_shark_design4_reference.png') }}
      - name: Enhance exact approved player artwork using official Real-ESRGAN on cache miss
        if: steps.artwork-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/player-art-ai"
          source "$RUNNER_TEMP/player-art-ai/bin/activate"
          python -m pip install torch==2.2.2 torchvision==0.17.2 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'numpy==1.26.4' 'opencv-python==4.10.0.84' 'Pillow==10.4.0' 'basicsr==1.4.2' 'realesrgan==0.3.0'
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          spec=importlib.util.find_spec("basicsr")
          f=Path(spec.origin).parent/"data"/"degradations.py"
          text=f.read_text()
          old="from torchvision.transforms.functional_tensor import rgb_to_grayscale"
          assert old in text
          f.write_text(text.replace(old,"from torchvision.transforms.functional import rgb_to_grayscale"))
          PY
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/RealESRGAN_x2plus.pth" https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.1/RealESRGAN_x2plus.pth
          python -u ci/prepare_design4_player.py "$RUNNER_TEMP/RealESRGAN_x2plus.pth"
      - name: Verify cached or newly generated player artwork
        run: |
          python - <<'PY'
          import hashlib, json, struct
          from pathlib import Path
          report=json.loads(Path("design4-artwork-verification.json").read_text())
          expected={"design4_player_header":(3764,208),"design4_player_dock":(3664,220),"design4_player_key":(240,144),"design4_info_panel":(1240,1240)}
          assert set(report)==set(expected)
          for name,size in expected.items():
              b=(Path("app/src/main/res/drawable-nodpi")/(name+".png")).read_bytes()
              assert b[:8]==b'\x89PNG\r\n\x1a\n'
              assert struct.unpack('>II',b[16:24])==size
              assert tuple(report[name]["size"])==size
              assert hashlib.sha256(b).hexdigest()==report[name]["sha256"]
              assert 0<=report[name]["mean_delta"]<=12
          print("PASS: exact player artwork outputs, checksums and dimensions")
          PY
      - name: Save verified enhanced player artwork
        if: steps.artwork-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            app/src/main/res/drawable-nodpi/design4_player_header.png
            app/src/main/res/drawable-nodpi/design4_player_dock.png
            app/src/main/res/drawable-nodpi/design4_player_key.png
            app/src/main/res/drawable-nodpi/design4_info_panel.png
            design4-artwork-verification.json
          key: ${{ steps.artwork-cache.outputs.cache-primary-key }}
      - name: Generate and verify transparent PNG symbols
        run: |
          python -m pip install Pillow==11.3.0 fonttools==4.59.2
          python ci/prepare_sky_font.py
          python ci/extract_premium_art.py
          python ci/prepare_holding_art34.py --enhanced-dir enhanced-artwork
          python ci/prepare_player_art.py
          echo '8b93640d45757966232af87dafbbc0d4dcfe11e9a05bd9f3143a7c609b6e50ba  app/src/main/res/drawable-nodpi/four_sharks_atlas.png' | sha256sum -c -
          python -c "from PIL import Image; im=Image.open('app/src/main/res/drawable-nodpi/four_sharks_atlas.png'); assert im.mode=='RGBA' and im.size==(1672,941) and im.getchannel('A').getextrema()==(0,255)"
      - name: Compile
        run: gradle --no-daemon :app:assembleRelease
      - name: Sign and verify
        env:
          SHARK_SIGNING_BUNDLE: ${{ secrets.SHARK_SIGNING_BUNDLE }}
          SHARK_KEYSTORE_B64: ${{ secrets.SHARK_KEYSTORE_B64 }}
          SHARK_KEYSTORE_PASSWORD: ${{ secrets.SHARK_KEYSTORE_PASSWORD }}
          SHARK_KEY_ALIAS: ${{ secrets.SHARK_KEY_ALIAS }}
          SHARK_KEY_PASSWORD: ${{ secrets.SHARK_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          export KS="$RUNNER_TEMP/shark-key"
          if [[ -n "$SHARK_SIGNING_BUNDLE" ]]; then
            SHARK_KEYSTORE_PASSWORD=$(python - <<'PY'
          import os,json,base64
          from pathlib import Path
          b=json.loads(os.environ["SHARK_SIGNING_BUNDLE"].strip(),strict=False)
          Path(os.environ["KS"]).write_bytes(base64.b64decode(''.join(b["keystore"].split()),validate=True))
          print(''.join(b["password"].split()))
          PY
            )
            echo "::add-mask::$SHARK_KEYSTORE_PASSWORD"
            export SHARK_KEYSTORE_PASSWORD
            export SHARK_KEY_PASSWORD="$SHARK_KEYSTORE_PASSWORD"
            export SHARK_KEY_ALIAS=sharknailtv
          else
            printf '%s' "${SHARK_KEYSTORE_B64:?Missing signing key}" | base64 -d > "$KS"
          fi
          tools="$ANDROID_HOME/build-tools/36.0.0"
          "$tools/zipalign" -P 16 -f 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" sign --ks "$KS" --ks-key-alias "$SHARK_KEY_ALIAS" --ks-pass env:SHARK_KEYSTORE_PASSWORD --key-pass env:SHARK_KEY_PASSWORD --out SharkNailTV.apk "$RUNNER_TEMP/aligned.apk"
          cert=$("$tools/apksigner" verify --print-certs SharkNailTV.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          test "$cert" = '14fea534b29f1196c0a2fcb0618cde8f6391ad6e9153a941fd8c86e3cb0fca96'
          "$tools/aapt" dump badging SharkNailTV.apk | grep -F "package: name='com.example.xtreamtv' versionCode='50054'"
          unzip -tq SharkNailTV.apk
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            unzip -l SharkNailTV.apk | grep -F "lib/$abi/libffmpegJNI.so"
          done
          rm -f "$KS"
      - uses: actions/upload-artifact@v4
        with:
          name: SharkSky-5.0.54-candidate-install-untested
          path: SharkNailTV.apk
          if-no-files-found: error
      - name: Audit packaged resources and duplicate files
        run: |
          python - <<'PY'
          import hashlib,json,zipfile
          from pathlib import Path
          with zipfile.ZipFile("SharkNailTV.apk") as z:
              files=[x for x in z.infolist() if not x.is_dir()]
              groups={}
              for x in files:
                  if x.filename.startswith(("res/","assets/")):
                      groups.setdefault(hashlib.sha256(z.read(x)).hexdigest(),[]).append(x.filename)
              report={"apk_bytes":Path("SharkNailTV.apk").stat().st_size,"entry_count":len(files),"largest_entries":[{"name":x.filename,"bytes":x.file_size,"compressed":x.compress_size} for x in sorted(files,key=lambda x:x.compress_size,reverse=True)[:35]],"identical_resources":[v for v in groups.values() if len(v)>1]}
              Path("apk-resource-audit.json").write_text(json.dumps(report,indent=2))
          PY
      - name: Fetch last published APK for upgrade test
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download v5.0.26 --repo "$GITHUB_REPOSITORY" --pattern SharkNailTV.apk --output "$RUNNER_TEMP/previous.apk"
          tools="$ANDROID_HOME/build-tools/36.0.0"
          previous_cert=$("$tools/apksigner" verify --print-certs "$RUNNER_TEMP/previous.apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          test "$previous_cert" = '14fea534b29f1196c0a2fcb0618cde8f6391ad6e9153a941fd8c86e3cb0fca96'
          "$tools/aapt" dump badging "$RUNNER_TEMP/previous.apk" | grep -F "package: name='com.example.xtreamtv' versionCode='50026'"
      - name: Retrieve published 5.0.33 APK for upgrade test
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/prior33"
          gh release download v5.0.33 --repo "$GITHUB_REPOSITORY" --pattern SharkNailTV.apk --output "$RUNNER_TEMP/prior33/SharkNailTV.apk"
          tools="$ANDROID_HOME/build-tools/36.0.0"
          cert=$("$tools/apksigner" verify --print-certs "$RUNNER_TEMP/prior33/SharkNailTV.apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          test "$cert" = '14fea534b29f1196c0a2fcb0618cde8f6391ad6e9153a941fd8c86e3cb0fca96'
          "$tools/aapt" dump badging "$RUNNER_TEMP/prior33/SharkNailTV.apk" | grep -F "package: name='com.example.xtreamtv' versionCode='50033'"
      - name: Retrieve manually installed 5.0.34 APK for upgrade test
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/prior34"
          gh run download 45785192289 --repo "$GITHUB_REPOSITORY" --name SharkSky-5.0.34-candidate-install-untested --dir "$RUNNER_TEMP/prior34"
          tools="$ANDROID_HOME/build-tools/36.0.0"
          cert=$("$tools/apksigner" verify --print-certs "$RUNNER_TEMP/prior34/SharkNailTV.apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          test "$cert" = '14fea534b29f1196c0a2fcb0618cde8f6391ad6e9153a941fd8c86e3cb0fca96'
          "$tools/aapt" dump badging "$RUNNER_TEMP/prior34/SharkNailTV.apk" | grep -F "package: name='com.example.xtreamtv' versionCode='50034'"
          unzip -tq "$RUNNER_TEMP/prior34/SharkNailTV.apk"
      - name: Retrieve verified 5.0.35 for actual upgrade test
        env:
