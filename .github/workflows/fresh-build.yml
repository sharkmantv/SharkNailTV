name: Shark Sky clean candidate
on:
  push:
    branches: ['design/premium-5.0.30-four-sharks']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: shark-sky-premium-5030-visual
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: SDK
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f -print -quit)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Verify selected design artwork
        run: |
          python3 - <<'PY'
          import struct, hashlib
          p='app/src/main/res/drawable-nodpi/premium_mockup3.png'
          b=open(p,'rb').read()
          assert b[:8]==b'\x89PNG\r\n\x1a\n'
          assert struct.unpack('>II',b[16:24])==(1400,1000)
          assert hashlib.sha1(('blob '+str(len(b))+'\0').encode()+b).hexdigest()=='87bbc44733b971a95a8937faee04f2b55876ff43'
          print('PASS: exact approved artwork')
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and verify exact-beta FFmpeg audio extension
        run: bash ci/build_ffmpeg_beta.sh
      - name: Retrieve verified open-source UHD artwork
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run=45769076206
          gh run view "$run" --repo "$GITHUB_REPOSITORY" --json headSha,headBranch | jq -e '.headSha=="d79b2bc6497e5d380f718826e1977f36fb2bc91c" and .headBranch=="artwork/realesrgan-4k"'
          timeout 95m gh run watch "$run" --repo "$GITHUB_REPOSITORY" --exit-status --interval 30
          gh run view "$run" --repo "$GITHUB_REPOSITORY" --json conclusion | jq -e '.conclusion=="success"'
          gh run download "$run" --repo "$GITHUB_REPOSITORY" --name Sky-Shark-AI-enhanced-4K --dir enhanced-artwork
          test -s enhanced-artwork/verification.json
          test -s enhanced-artwork/comparison.png
      - name: Generate and verify transparent PNG symbols
        run: |
          python -m pip install Pillow==11.3.0 fonttools==4.59.2
          python ci/prepare_sky_font.py
          python ci/extract_premium_art.py
          python ci/prepare_holding_art34.py --enhanced-dir enhanced-artwork
          echo '8b93640d45757966232af87dafbbc0d4dcfe11e9a05bd9f3143a7c609b6e50ba  app/src/main/res/drawable-nodpi/four_sharks_atlas.png' | sha256sum -c -
          python -c "from PIL import Image; im=Image.open('app/src/main/res/drawable-nodpi/four_sharks_atlas.png'); assert im.mode=='RGBA' and im.size==(1672,941) and im.getchannel('A').getextrema()==(0,255)"
      - name: Compile
        run: gradle --no-daemon :app:assembleRelease
      - name: Sign and verify
        env:
          SHARK_SIGNING_BUNDLE: ${{ secrets.SHARK_SIGNING_BUNDLE }}
          SHARK_KEYSTORE_B64: ${{ secrets.SHARK_KEYSTORE_B64 }}
          SHARK_KEYSTORE_PASSWORD: ${{ secrets.SHARK_KEYSTORE_PASSWORD }}
          SHARK_KEY_ALIAS: ${{ secrets.SHARK_KEY_ALIAS }}
          SHARK_KEY_PASSWORD: ${{ secrets.SHARK_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          export KS="$RUNNER_TEMP/shark-key"
          if [[ -n "$SHARK_SIGNING_BUNDLE" ]]; then
            SHARK_KEYSTORE_PASSWORD=$(python - <<'PY'
          import os,json,base64
          from pathlib import Path
          b=json.loads(os.environ["SHARK_SIGNING_BUNDLE"].strip(),strict=False)
          Path(os.environ["KS"]).write_bytes(base64.b64decode(''.join(b["keystore"].split()),validate=True))
          print(''.join(b["password"].split()))
          PY
            )
            echo "::add-mask::$SHARK_KEYSTORE_PASSWORD"
            export SHARK_KEYSTORE_PASSWORD
            export SHARK_KEY_PASSWORD="$SHARK_KEYSTORE_PASSWORD"
            export SHARK_KEY_ALIAS=sharknailtv
          else
            printf '%s' "${SHARK_KEYSTORE_B64:?Missing signing key}" | base64 -d > "$KS"
          fi
          tools="$ANDROID_HOME/build-tools/36.0.0"
          "$tools/zipalign" -P 16 -f 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" sign --ks "$KS" --ks-key-alias "$SHARK_KEY_ALIAS" --ks-pass env:SHARK_KEYSTORE_PASSWORD --key-pass env:SHARK_KEY_PASSWORD --out SharkNailTV.apk "$RUNNER_TEMP/aligned.apk"
          cert=$("$tools/apksigner" verify --print-certs SharkNailTV.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          test "$cert" = '14fea534b29f1196c0a2fcb0618cde8f6391ad6e9153a941fd8c86e3cb0fca96'
          "$tools/aapt" dump badging SharkNailTV.apk | grep -F "package: name='com.example.xtreamtv' versionCode='50034'"
          unzip -tq SharkNailTV.apk
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            unzip -l SharkNailTV.apk | grep -F "lib/$abi/libffmpegJNI.so"
          done
          rm -f "$KS"
      - uses: actions/upload-artifact@v4
        with:
          name: SharkSky-5.0.34-candidate-install-untested
          path: SharkNailTV.apk
          if-no-files-found: error
      - name: Fetch last published APK for upgrade test
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download v5.0.26 --repo "$GITHUB_REPOSITORY" --pattern SharkNailTV.apk --output "$RUNNER_TEMP/previous.apk"
          tools="$ANDROID_HOME/build-tools/36.0.0"
          previous_cert=$("$tools/apksigner" verify --print-certs "$RUNNER_TEMP/previous.apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          test "$previous_cert" = '14fea534b29f1196c0a2fcb0618cde8f6391ad6e9153a941fd8c86e3cb0fca96'
          "$tools/aapt" dump badging "$RUNNER_TEMP/previous.apk" | grep -F "package: name='com.example.xtreamtv' versionCode='50026'"
      - name: Retrieve published 5.0.33 APK for upgrade test
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/prior33"
          gh release download v5.0.33 --repo "$GITHUB_REPOSITORY" --pattern SharkNailTV.apk --output "$RUNNER_TEMP/prior33/SharkNailTV.apk"
          tools="$ANDROID_HOME/build-tools/36.0.0"
          cert=$("$tools/apksigner" verify --print-certs "$RUNNER_TEMP/prior33/SharkNailTV.apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          test "$cert" = '14fea534b29f1196c0a2fcb0618cde8f6391ad6e9153a941fd8c86e3cb0fca96'
          "$tools/aapt" dump badging "$RUNNER_TEMP/prior33/SharkNailTV.apk" | grep -F "package: name='com.example.xtreamtv' versionCode='50033'"
      - name: Create local playback test fixture
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i testsrc2=size=640x360:rate=24 -f lavfi -i sine=frequency=440:sample_rate=48000 -t 180 -c:v libx264 -preset veryfast -pix_fmt yuv420p -b:v 500k -c:a aac -movflags +faststart fixture.mp4
          test -s fixture.mp4
      - name: Prepare emulator acceleration
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod a+rw /dev/kvm
          fi
      - name: Emulator smoke test
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_I_WANT_MY_TCG: "yes"
        with:
          api-level: 35
          emulator-boot-timeout: 1200
          arch: x86_64
          target: google_apis
          disable-animations: true
          ram-size: 3072M
          heap-size: 512M
          pre-emulator-launch-script: python3 ci/configure_uhd_emulator.py
          script: |
            set -e
            adb shell settings put secure immersive_mode_confirmations confirmed
            adb shell wm size 1080x1920
            adb shell wm density 320
            adb shell input keyevent KEYCODE_WAKEUP
            adb shell wm dismiss-keyguard
            adb install "$RUNNER_TEMP/previous.apk"
            adb shell am start -W -n com.example.xtreamtv/.MainActivity
            adb shell pidof com.example.xtreamtv
            adb install -r "$RUNNER_TEMP/prior33/SharkNailTV.apk"
            adb shell dumpsys package com.example.xtreamtv | grep -F 'versionCode=50033'
            adb install -r SharkNailTV.apk
            adb shell am force-stop com.google.android.apps.nexuslauncher
            adb shell am force-stop com.example.xtreamtv
            adb logcat -c
            adb shell am start -W -n com.example.xtreamtv/.MainActivity
            sleep 5
            adb shell pidof com.example.xtreamtv
            adb shell dumpsys package com.example.xtreamtv | grep -F 'versionCode=50034'
            adb exec-out screencap -p > premium-home-preview.png
            python3 ci/check_premium_home.py
            adb exec-out screencap -p > premium-home-preview.png
            python3 ci/check_rendered_art.py
            adb logcat -d -s SharkUHD:I | grep -F 'Full resolution 3840x2160 artwork and all four card layers decoded'
            adb shell wm size reset
            adb shell wm size
            adb shell am force-stop com.example.xtreamtv
            adb shell am start -W -n com.example.xtreamtv/.MainActivity
            sleep 4
            python3 ci/check_premium_home.py
            adb exec-out screencap -p > premium-home-4k.png
            python3 -c "from PIL import Image; im=Image.open('premium-home-4k.png'); assert im.size==(3840,2160),im.size; print('PASS: actual 3840x2160 emulator screenshot')"
            adb shell wm size 1080x1920
            adb shell am force-stop com.example.xtreamtv
            adb shell am start -W -n com.example.xtreamtv/.MainActivity
            sleep 3
            python3 ci/check_tv_ui.py --resolution 1080p --fixture-video fixture.mp4
            adb shell wm size reset
            adb shell wm density 640
            adb shell am force-stop com.example.xtreamtv
            adb shell am start -W -n com.example.xtreamtv/.MainActivity
            sleep 4
            python3 ci/check_premium_home.py
            adb exec-out screencap -p > premium-home-scaled-4k.png
            python3 -c "from PIL import Image; assert Image.open('premium-home-scaled-4k.png').size==(3840,2160)"
            python3 ci/check_tv_ui.py --resolution 4k --fixture-video fixture.mp4 --saved-login
            python3 -c "from PIL import Image; from pathlib import Path; assert all(Path(f'premium-{s}-{r}.png').is_file() and Image.open(f'premium-{s}-{r}.png').size==size for s in ('settings','movies','series','live','player') for r,size in (('1080p',(1920,1080)),('4k',(3840,2160)))); print('PASS: all main screens verified at 1080p and UHD')"
            adb logcat -d -s AndroidRuntime:E > "$RUNNER_TEMP/shark-crash.log"
            if grep -F 'Process: com.example.xtreamtv,' "$RUNNER_TEMP/shark-crash.log"; then exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: SharkSky-5.0.34-signed
          path: |
            SharkNailTV.apk
            ffmpeg-source.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SharkSky-5.0.34-home-preview
          path: |
            premium-home-preview.png
            premium-home-4k.png
            enhanced-artwork/comparison.png
            enhanced-artwork/verification.json
            premium-focus-*.png
            premium-home-scaled-4k.png
            premium-settings-*.png
            premium-live-*.png
            premium-movies-*.png
            premium-series-*.png
            premium-player-*.png
            failed-ui*.xml
            failed-ui*.png
          if-no-files-found: ignore
  publish:
    needs: build
    if: github.ref == 'refs/heads/design/premium-5.0.30-four-sharks'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    concurrency:
      group: shark-sky-verified-release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SharkSky-5.0.34-signed
      - name: Reverify exact APK and publish OTA
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f -print -quit)"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" 'build-tools;36.0.0'
          tools="$ANDROID_HOME/build-tools/36.0.0"
          cert=$("$tools/apksigner" verify --print-certs SharkNailTV.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          test "$cert" = '14fea534b29f1196c0a2fcb0618cde8f6391ad6e9153a941fd8c86e3cb0fca96'
          "$tools/aapt" dump badging SharkNailTV.apk | grep -F "package: name='com.example.xtreamtv' versionCode='50034'"
          unzip -tq SharkNailTV.apk
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do unzip -l SharkNailTV.apk | grep -F "lib/$abi/libffmpegJNI.so"; done
          tag=v5.0.34
          latest=$(gh release view --repo "$GH_REPO" --json tagName --jq .tagName)
          test "$latest" = v5.0.33
          mkdir -p prior
          gh release download "$latest" --repo "$GH_REPO" --pattern SharkNailTV.apk --dir prior
          priorcert=$("$tools/apksigner" verify --print-certs prior/SharkNailTV.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          test "$cert" = "$priorcert"
          "$tools/aapt" dump badging prior/SharkNailTV.apk | grep -F "package: name='com.example.xtreamtv' versionCode='50033'"
          checksum=$(sha256sum SharkNailTV.apk | cut -d' ' -f1)
          bytes=$(stat -c %s SharkNailTV.apk)
          jq -n --arg tag "$tag" --arg link "https://github.com/$GH_REPO/releases/download/$tag/SharkNailTV.apk" --arg digest "sha256:$checksum" --argjson size "$bytes" '{tag_name:$tag,assets:[{name:"SharkNailTV.apk",browser_download_url:$link,size:$size,digest:$digest}]}' > update.json
          if gh release view "$tag" --repo "$GH_REPO" >/dev/null 2>&1; then
            test "$(gh release view "$tag" --repo "$GH_REPO" --json isDraft --jq .isDraft)" = true
            test "$(gh release view "$tag" --repo "$GH_REPO" --json targetCommitish --jq .targetCommitish)" = "$GITHUB_SHA"
          else
            gh release create "$tag" --draft --repo "$GH_REPO" --target "$GITHUB_SHA" --title "Shark Sky 5.0.34" --notes "Verified emulator upgrade from 5.0.33; AI-enhanced UHD artwork; all main screens rendered and tested at 1080p and 3840x2160, local fixture posters and playback. Real TV and provider testing outstanding."
          fi
          for asset in SharkNailTV.apk update.json ffmpeg-source.tar.gz; do gh release upload "$tag" "$asset" --repo "$GH_REPO" --clobber; done
          gh release view "$tag" --repo "$GH_REPO" --json assets | jq -e --arg digest "sha256:$checksum" --argjson size "$bytes" '(.assets | length)==3 and any(.assets[]; .name=="SharkNailTV.apk" and .size==$size and .digest==$digest) and any(.assets[]; .name=="update.json" and .size>0) and any(.assets[]; .name=="ffmpeg-source.tar.gz" and .size>0)'
          gh release edit "$tag" --repo "$GH_REPO" --draft=false --latest
          gh release view "$tag" --repo "$GH_REPO" --json tagName,isDraft,assets | jq -e --arg tag "$tag" '.tagName==$tag and .isDraft==false and any(.assets[]; .name=="SharkNailTV.apk") and any(.assets[]; .name=="update.json")'

