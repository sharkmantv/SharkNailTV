name: Shark Sky clean candidate
on:
  push:
    branches: ['fresh/shark-sky-5.0.0']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: shark-sky-verified-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: SDK
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f -print -quit)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Build and verify exact-beta FFmpeg audio extension
        run: bash ci/build_ffmpeg_beta.sh
      - name: Compile
        run: gradle --no-daemon :app:assembleRelease
      - name: Sign and verify
        env:
          SHARK_SIGNING_BUNDLE: ${{ secrets.SHARK_SIGNING_BUNDLE }}
          SHARK_KEYSTORE_B64: ${{ secrets.SHARK_KEYSTORE_B64 }}
          SHARK_KEYSTORE_PASSWORD: ${{ secrets.SHARK_KEYSTORE_PASSWORD }}
          SHARK_KEY_ALIAS: ${{ secrets.SHARK_KEY_ALIAS }}
          SHARK_KEY_PASSWORD: ${{ secrets.SHARK_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          export KS="$RUNNER_TEMP/shark-key"
          if [[ -n "$SHARK_SIGNING_BUNDLE" ]]; then
            SHARK_KEYSTORE_PASSWORD=$(python - <<'PY'
          import os,json,base64
          from pathlib import Path
          b=json.loads(os.environ["SHARK_SIGNING_BUNDLE"].strip(),strict=False)
          Path(os.environ["KS"]).write_bytes(base64.b64decode(''.join(b["keystore"].split()),validate=True))
          print(''.join(b["password"].split()))
          PY
            )
            echo "::add-mask::$SHARK_KEYSTORE_PASSWORD"
            export SHARK_KEYSTORE_PASSWORD
            export SHARK_KEY_PASSWORD="$SHARK_KEYSTORE_PASSWORD"
            export SHARK_KEY_ALIAS=sharknailtv
          else
            printf '%s' "${SHARK_KEYSTORE_B64:?Missing signing key}" | base64 -d > "$KS"
          fi
          tools="$ANDROID_HOME/build-tools/36.0.0"
          "$tools/zipalign" -P 16 -f 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" sign --ks "$KS" --ks-key-alias "$SHARK_KEY_ALIAS" --ks-pass env:SHARK_KEYSTORE_PASSWORD --key-pass env:SHARK_KEY_PASSWORD --out SharkNailTV.apk "$RUNNER_TEMP/aligned.apk"
          cert=$("$tools/apksigner" verify --print-certs SharkNailTV.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          test "$cert" = '14fea534b29f1196c0a2fcb0618cde8f6391ad6e9153a941fd8c86e3cb0fca96'
          "$tools/aapt" dump badging SharkNailTV.apk | grep -F "package: name='com.example.xtreamtv' versionCode='50021'"
          unzip -tq SharkNailTV.apk
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            unzip -l SharkNailTV.apk | grep -F "lib/$abi/libffmpegJNI.so"
          done
          rm -f "$KS"
      - uses: actions/upload-artifact@v4
        with:
          name: SharkSky-5.0.21-candidate-install-untested
          path: SharkNailTV.apk
          if-no-files-found: error
      - name: Fetch last published APK for upgrade test
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download v5.0.20 --repo "$GITHUB_REPOSITORY" --pattern SharkNailTV.apk --output "$RUNNER_TEMP/previous.apk"
          tools="$ANDROID_HOME/build-tools/36.0.0"
          previous_cert=$("$tools/apksigner" verify --print-certs "$RUNNER_TEMP/previous.apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          test "$previous_cert" = '14fea534b29f1196c0a2fcb0618cde8f6391ad6e9153a941fd8c86e3cb0fca96'
          "$tools/aapt" dump badging "$RUNNER_TEMP/previous.apk" | grep -F "package: name='com.example.xtreamtv' versionCode='50020'"
      - name: Prepare emulator acceleration
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod a+rw /dev/kvm
          fi
      - name: Emulator smoke test
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_I_WANT_MY_TCG: "yes"
        with:
          api-level: 35
          emulator-boot-timeout: 1200
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            set -e
            adb shell settings put secure immersive_mode_confirmations confirmed
            adb shell wm size 1080x1920
            adb shell wm density 320
            adb shell input keyevent KEYCODE_WAKEUP
            adb shell wm dismiss-keyguard
            adb install "$RUNNER_TEMP/previous.apk"
            adb shell am start -W -n com.example.xtreamtv/.MainActivity
            adb shell pidof com.example.xtreamtv
            adb install -r SharkNailTV.apk
            adb logcat -c
            adb shell am start -W -n com.example.xtreamtv/.MainActivity
            sleep 5
            adb shell pidof com.example.xtreamtv
            adb shell dumpsys package com.example.xtreamtv | grep -F 'versionCode=50021'
            python3 ci/check_tv_ui.py
            adb logcat -d -s AndroidRuntime:E > "$RUNNER_TEMP/shark-crash.log"
            if grep -F 'Process: com.example.xtreamtv,' "$RUNNER_TEMP/shark-crash.log"; then exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: SharkSky-5.0.21-signed
          path: SharkNailTV.apk
          if-no-files-found: error
      - name: Publish OTA after successful upgrade and UI test
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null || true)
          if [ -n "$latest" ] && [ "$(printf '%s\n' "$latest" v5.0.21 | sort -V | tail -1)" != v5.0.21 ]; then
            echo "A newer release exists; skipping OTA publication."
            exit 0
          fi
          checksum=$(sha256sum SharkNailTV.apk | cut -d' ' -f1)
          bytes=$(stat -c %s SharkNailTV.apk)
          jq -n --arg tag v5.0.21 --arg link "https://github.com/$GITHUB_REPOSITORY/releases/download/v5.0.21/SharkNailTV.apk" --arg digest "sha256:$checksum" --argjson size "$bytes" '{tag_name:$tag,assets:[{name:"SharkNailTV.apk",browser_download_url:$link,size:$size,digest:$digest}]}' > update.json
          for attempt in 1 2 3; do
            if gh release create v5.0.21 SharkNailTV.apk update.json ffmpeg-source.tar.gz --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Shark Sky 5.0.21" --notes "High-resolution TMDB movie and series artwork, direct in-app update downloads, progress and APK validation; first-video-frame recovery for movies and series; reuse the existing Live TV player for fullscreen transitions; restore SDR/HDR preferences and two-row poster browsing; resize the same Live TV surface instead of switching surfaces; add timed Now/Next and full per-channel EPG with caching; unified dark navy theme and TV-friendly typography; request native decoder HDR-to-SDR tone mapping and report actual output transfer; add fullscreen picture range selection with VOD position retention; multi-channel EPG timeline and current programme information in visible channel rows; enlarged preview and highlighted channel EPG without autoplay; two measured portrait poster rows with edge-to-edge artwork; Media3 beta01, separate Live/VOD range preferences, OpenGL SDR path with TextureView fallback and silent decoder recovery; bounded in-memory category, stream and episode caching, forced Retry refresh, account-change invalidation and low-memory eviction. Player and picture-mode implementation unchanged. Direct release manifest updater with REST fallback and explicit HTTP diagnostics. Exact-beta FFmpeg audio-only extension, hardware-first, four verified ABIs; corresponding source included. APK signature, upgrade from 5.0.20, Home/Settings and two-row poster geometry smoke test verified by CI. Physical-device playback verification pending." --latest; then exit 0; fi
            if gh release view v5.0.21 --repo "$GITHUB_REPOSITORY" --json assets --jq '[.assets[].name] | contains(["SharkNailTV.apk","update.json","ffmpeg-source.tar.gz"])' | grep -Fx true; then exit 0; fi
            sleep $((attempt*10))
          done
          echo "OTA publication failed; verified artifact remains available."
          exit 1
