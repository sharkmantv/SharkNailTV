name: Sky Shark quick signed test build
on:
  push:
    branches: ['quick/**']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: sky-shark-quick-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-read-only: false
      - name: Verify changes are compatible with prepared assets
        env:
          KIT_BASE: 6a34a315c1204c381a5aa4427022c22c104b21a4
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$KIT_BASE" HEAD
          python3 - <<'PY'
          import os, re, subprocess
          from pathlib import Path
          base=os.environ['KIT_BASE']
          changed=subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines()
          allowed=lambda p:p.startswith('app/src/main/java/') or p.startswith('.github/workflows/') or p=='app/build.gradle.kts' or p in ('ci/SdrStreamMatchTest.java','ci/SdrFrameSlotTest.java','ci/PqPreviewLutTest.java','ci/prepare_wave_login.py','ci/artwork/wave_login_source.b64')
          assert all(map(allowed,changed)), 'Quick build only supports Java and version changes; use full workflow for other files: '+str([p for p in changed if not allowed(p)])
          gradle=Path('app/build.gradle.kts').read_text()
          old=subprocess.check_output(['git','show',base+':app/build.gradle.kts'],text=True)
          normalize=lambda s:re.sub(r'versionCode\s*=\s*\d+|versionName\s*=\s*"[^"]+"','VERSION',s)
          assert normalize(gradle)==normalize(old), 'Dependency or build configuration changed: full build required'
          code=int(re.search(r'versionCode\s*=\s*(\d+)',gradle)[1])
          name=re.search(r'versionName\s*=\s*"([0-9.]+)"',gradle)[1]
          assert code>=50071
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write(f'VERSION_CODE={code}\nVERSION_NAME={name}\n')
          PY
      - name: Test SDR feed matching
        run: |
          mkdir -p "$RUNNER_TEMP/sdr-tests"
          javac -d "$RUNNER_TEMP/sdr-tests" app/src/main/java/com/example/xtreamtv/SdrStreamMatch.java ci/SdrStreamMatchTest.java
          java -cp "$RUNNER_TEMP/sdr-tests" com.example.xtreamtv.SdrStreamMatchTest
          javac -d "$RUNNER_TEMP/sdr-tests" app/src/main/java/com/example/xtreamtv/RefreshMatch.java ci/RefreshMatchTest.java app/src/main/java/com/example/xtreamtv/SdrCadence.java ci/SdrCadenceTest.java
          java -cp "$RUNNER_TEMP/sdr-tests" com.example.xtreamtv.RefreshMatchTest
          java -cp "$RUNNER_TEMP/sdr-tests" com.example.xtreamtv.SdrCadenceTest
          javac -d "$RUNNER_TEMP/sdr-tests" app/src/main/java/com/example/xtreamtv/SdrFrameSlot.java ci/SdrFrameSlotTest.java
          java -cp "$RUNNER_TEMP/sdr-tests" com.example.xtreamtv.SdrFrameSlotTest
          javac -d "$RUNNER_TEMP/sdr-tests" app/src/main/java/com/example/xtreamtv/PqPreviewLut.java app/src/main/java/com/example/xtreamtv/DirectSdrShaders.java ci/PqPreviewLutTest.java
          java -cp "$RUNNER_TEMP/sdr-tests" com.example.xtreamtv.PqPreviewLutTest
      - name: Reuse verified FFmpeg and prepared UHD artwork
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run view 46119584104 --repo "$GITHUB_REPOSITORY" --json conclusion,headSha | jq -e '.conclusion=="success" and .headSha=="1113d23a92ca9878904107b134879f7615a94054"'
          gh run download 46119584104 --repo "$GITHUB_REPOSITORY" --name Sky-Shark-5.0.71-Android-Studio-ready --dir "$RUNNER_TEMP/studio-kit"
          kit="$RUNNER_TEMP/studio-kit"
          test -s "$kit/app/libs/media3-ffmpeg-1.12.0-rc01.aar"
          test -s "$kit/app/src/main/res/drawable-nodpi/design4_player_header.png"
          test -s "$kit/app/src/main/res/drawable-nodpi/design4_player_dock.png"
          rm -rf "$kit/app/src/main/java"
          cp -a app/src/main/java "$kit/app/src/main/java"
          cp app/build.gradle.kts "$kit/app/build.gradle.kts"
          rm -rf app
          cp -a "$kit/app" app
          rm -rf app/build app/.gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Enhance approved Wave login artwork with Real-ESRGAN x2plus
        run: |
          set -euo pipefail
          python -m pip install torch==2.2.2 torchvision==0.17.2 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'numpy==1.26.4' 'opencv-python==4.10.0.84' 'Pillow==10.4.0' 'basicsr==1.4.2' 'realesrgan==0.3.0'
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          f=Path(importlib.util.find_spec("basicsr").origin).parent/"data"/"degradations.py"
          s=f.read_text()
          old="from torchvision.transforms.functional_tensor import rgb_to_grayscale"
          new="from torchvision.transforms.functional import rgb_to_grayscale"
          assert old in s or new in s
          f.write_text(s.replace(old,new))
          PY
          python -c 'from realesrgan import RealESRGANer'
          curl --fail --location --retry 3 --output RealESRGAN_x2plus.pth https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.1/RealESRGAN_x2plus.pth
          python -u ci/prepare_wave_login.py
      - name: SDK
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f -print -quit)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Compile signed-test candidate
        run: gradle --no-daemon :app:assembleRelease
      - name: Sign and verify
        env:
          SHARK_SIGNING_BUNDLE: ${{ secrets.SHARK_SIGNING_BUNDLE }}
          SHARK_KEYSTORE_B64: ${{ secrets.SHARK_KEYSTORE_B64 }}
          SHARK_KEYSTORE_PASSWORD: ${{ secrets.SHARK_KEYSTORE_PASSWORD }}
          SHARK_KEY_ALIAS: ${{ secrets.SHARK_KEY_ALIAS }}
          SHARK_KEY_PASSWORD: ${{ secrets.SHARK_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          export KS="$RUNNER_TEMP/shark-key"
          if [[ -n "$SHARK_SIGNING_BUNDLE" ]]; then
            SHARK_KEYSTORE_PASSWORD=$(python - <<'PY'
          import os,json,base64
          from pathlib import Path
          b=json.loads(os.environ["SHARK_SIGNING_BUNDLE"].strip(),strict=False)
          Path(os.environ["KS"]).write_bytes(base64.b64decode(''.join(b["keystore"].split()),validate=True))
          print(''.join(b["password"].split()))
          PY
            )
            echo "::add-mask::$SHARK_KEYSTORE_PASSWORD"
            export SHARK_KEYSTORE_PASSWORD
            export SHARK_KEY_PASSWORD="$SHARK_KEYSTORE_PASSWORD"
            export SHARK_KEY_ALIAS=sharknailtv
          else
            printf '%s' "${SHARK_KEYSTORE_B64:?Missing signing key}" | base64 -d > "$KS"
          fi
          trap 'rm -f "$KS"' EXIT
          tools="$ANDROID_HOME/build-tools/36.0.0"
          "$tools/zipalign" -P 16 -f 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" sign --ks "$KS" --ks-key-alias "$SHARK_KEY_ALIAS" --ks-pass env:SHARK_KEYSTORE_PASSWORD --key-pass env:SHARK_KEY_PASSWORD --out SharkNailTV.apk "$RUNNER_TEMP/aligned.apk"
          cert=$("$tools/apksigner" verify --print-certs SharkNailTV.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          test "$cert" = '14fea534b29f1196c0a2fcb0618cde8f6391ad6e9153a941fd8c86e3cb0fca96'
          "$tools/aapt" dump badging SharkNailTV.apk | grep -F "package: name='com.example.xtreamtv' versionCode='$VERSION_CODE'"
          unzip -tq SharkNailTV.apk
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            unzip -l SharkNailTV.apk | grep -F "lib/$abi/libffmpegJNI.so"
          done
          rm -f "$KS"
      - name: Upload compiled and signature-checked candidate
        uses: actions/upload-artifact@v4
        with:
          name: Sky-Shark-${{ env.VERSION_NAME }}-quick-install-untested
          path: SharkNailTV.apk
          if-no-files-found: error
      - name: Retrieve known signed baseline for direct upgrade
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run view 46164117166 --repo "$GITHUB_REPOSITORY" --json conclusion,headSha | jq -e '.conclusion=="success" and .headSha=="1e8ee65ab6c14dce281c9cc1f281b266bc2347f5"'
          gh run download 46164117166 --repo "$GITHUB_REPOSITORY" --name Sky-Shark-5.1.20-quick-install-verified --dir "$RUNNER_TEMP/prior520"
          (cd "$RUNNER_TEMP/prior520" && sha256sum -c quick-install-verified.sha256)
          cert=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$RUNNER_TEMP/prior520/SharkNailTV.apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          test "$cert" = '14fea534b29f1196c0a2fcb0618cde8f6391ad6e9153a941fd8c86e3cb0fca96'
      - name: Enable emulator acceleration
        run: if [ -e /dev/kvm ]; then sudo chmod a+rw /dev/kvm; fi
      - name: Short direct upgrade and launch test
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_I_WANT_MY_TCG: 'yes'
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          emulator-boot-timeout: 1200
          disable-animations: true
          script: |
            set -e
            adb install "$RUNNER_TEMP/prior520/SharkNailTV.apk"
            adb shell dumpsys package com.example.xtreamtv | grep -F 'versionCode=50120 '
            adb install -r SharkNailTV.apk
            adb shell dumpsys package com.example.xtreamtv | grep -F "versionCode=$VERSION_CODE "
            adb logcat -c
            adb shell am start -W -n com.example.xtreamtv/.MainActivity
            sleep 5
            adb shell pidof com.example.xtreamtv
            adb logcat -d -s AndroidRuntime:E > "$RUNNER_TEMP/quick-crash.log"
            if grep -F 'Process: com.example.xtreamtv,' "$RUNNER_TEMP/quick-crash.log"; then exit 1; fi
            adb shell uiautomator dump /sdcard/shark-login.xml
            adb pull /sdcard/shark-login.xml "$RUNNER_TEMP/shark-login.xml"
            python -c 'import os, xml.etree.ElementTree as ET; root=ET.parse(os.path.join(os.environ["RUNNER_TEMP"],"shark-login.xml")); nodes=list(root.iter("node")); inputs=[n for n in nodes if n.get("class")=="android.widget.EditText"]; assert len(inputs)==3, "Three native editable login fields required"; assert any(n.get("text")=="Load playlist" and n.get("clickable")=="true" for n in nodes); assert any(n.get("password")=="true" for n in inputs), "Password must start masked"'
            adb exec-out screencap -p > login-preview.png
            sha256sum SharkNailTV.apk > quick-install-verified.sha256
      - name: Upload quick upgrade-verified test APK
        uses: actions/upload-artifact@v4
        with:
          name: Sky-Shark-${{ env.VERSION_NAME }}-quick-install-verified
          path: |
            SharkNailTV.apk
            quick-install-verified.sha256
          if-no-files-found: error
      - name: Upload actual Android login screenshot
        uses: actions/upload-artifact@v4
        with:
          name: Sky-Shark-${{ env.VERSION_NAME }}-login-preview
          path: login-preview.png
          if-no-files-found: error
