name: Free open-source Sky Shark 4K artwork
on:
  push:
    branches: ['artwork/realesrgan-4k']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  enhance:
    if: github.ref == 'refs/heads/artwork/realesrgan-4k'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU-only Real-ESRGAN dependencies
        run: |
          python -m pip install torch==2.2.2 torchvision==0.17.2 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'numpy==1.26.4' 'opencv-python==4.10.0.84' 'Pillow==10.4.0' 'basicsr==1.4.2' 'realesrgan==0.3.0'
          python -c 'from realesrgan import RealESRGANer; print("Real-ESRGAN CPU import OK")'
      - name: Download official x2 model
        run: |
          curl --fail --location --retry 3 --output RealESRGAN_x2plus.pth https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.1/RealESRGAN_x2plus.pth
          sha256sum RealESRGAN_x2plus.pth
      - name: Enhance exact approved artwork and verify output
        run: python -u ci/enhance_sky_shark.py
      - uses: actions/upload-artifact@v4
        with:
          name: Sky-Shark-AI-enhanced-4K
          path: artwork-output/
          if-no-files-found: error
          retention-days: 14
