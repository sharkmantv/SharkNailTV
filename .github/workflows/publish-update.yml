name: Publish SharkNailTV Update
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - '*.properties'
      - '.github/workflows/publish-update.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sharknailtv-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SHARK_SIGNING_BUNDLE: ${{ secrets.SHARK_SIGNING_BUNDLE }}
      SHARK_KEYSTORE_B64: ${{ secrets.SHARK_KEYSTORE_B64 }}
      SHARK_KEYSTORE_PASSWORD: ${{ secrets.SHARK_KEYSTORE_PASSWORD }}
      SHARK_KEY_ALIAS: ${{ secrets.SHARK_KEY_ALIAS }}
      SHARK_KEY_PASSWORD: ${{ secrets.SHARK_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Require permanent signing credentials
        shell: bash
        run: |
          if [[ -n "$SHARK_SIGNING_BUNDLE" ]]; then exit 0; fi
          for name in SHARK_KEYSTORE_B64 SHARK_KEYSTORE_PASSWORD SHARK_KEY_ALIAS SHARK_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret $name. Set up a permanent signing key before publishing app updates."
              exit 1
            fi
          done
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 37
        shell: bash
        run: |
          SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Prepare signing key and version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          code=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name' |
            python -c 'import re,sys; versions = [tuple(map(int, m.groups(default="0"))) for line in sys.stdin if (m := re.fullmatch(r"v?(\d{1,2})\.(\d{1,2})(?:\.(\d{1,2}))?", line.strip()))]; print(max([30307] + [a*10000+b*100+c for a,b,c in versions]) + 1)')
          version="$((code / 10000)).$((code / 100 % 100)).$((code % 100))"
          printf 'VERSION_CODE=%s\nVERSION_NAME=%s\n' "$code" "$version" >> "$GITHUB_ENV"
          printf 'RELEASE_TAG=v%s\n' "$version" >> "$GITHUB_ENV"
          if [[ -n "$SHARK_SIGNING_BUNDLE" ]]; then
            export SHARK_KEYSTORE_PATH="$RUNNER_TEMP/sharknailtv.p12"
            umask 077
            SHARK_KEYSTORE_PASSWORD=$(python - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path

          bundle = json.loads(os.environ['SHARK_SIGNING_BUNDLE'].strip(), strict=False)
          key = ''.join(bundle['keystore'].split())
          Path(os.environ['SHARK_KEYSTORE_PATH']).write_bytes(base64.b64decode(key, validate=True))
          print(''.join(bundle['password'].split()))
          PY
            )
            echo "::add-mask::$SHARK_KEYSTORE_PASSWORD"
            printf 'SHARK_KEYSTORE_PASSWORD=%s\nSHARK_KEY_PASSWORD=%s\nSHARK_KEY_ALIAS=sharknailtv\n' "$SHARK_KEYSTORE_PASSWORD" "$SHARK_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          else
            export SHARK_KEYSTORE_PATH="$RUNNER_TEMP/shark-updates.jks"
            umask 077
            printf '%s' "$SHARK_KEYSTORE_B64" | base64 --decode > "$SHARK_KEYSTORE_PATH"
          fi
          printf 'SHARK_KEYSTORE_PATH=%s\n' "$SHARK_KEYSTORE_PATH" >> "$GITHUB_ENV"
      - name: Build signed update APK
        run: gradle --no-daemon --stacktrace :app:assembleRelease -PSHARK_VERSION_CODE="$VERSION_CODE" -PSHARK_VERSION_NAME="$VERSION_NAME"
      - name: Prepare release asset
        shell: bash
        run: |
          cp app/build/outputs/apk/release/app-release.apk SharkNailTV.apk
          test -s SharkNailTV.apk
      - name: Prepare API-free update manifest
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          tag = os.environ["RELEASE_TAG"]
          url = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{tag}/SharkNailTV.apk"
          Path("update.json").write_text(json.dumps({
              "tag_name": tag,
              "draft": False,
              "prerelease": False,
              "assets": [{"name": "SharkNailTV.apk", "browser_download_url": url}]
          }), encoding="utf-8")
          PY
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$RELEASE_TAG" SharkNailTV.apk update.json --target "$GITHUB_SHA" --title "SharkNailTV $VERSION_NAME" --notes "SharkNailTV update $VERSION_NAME" --latest
