name: Build SharkNailTV ZIP and publish OTA on upload

on:
  push:
    branches: [main, development/4.1.0-catalogue-ui]
    paths:
      - 'incoming/SharkNailTV.zip'
      - '.github/workflows/build-zip.yml'
  workflow_dispatch:
    inputs:
      source:
        description: Android source to build
        type: choice
        options: [repository, zip, repository-zip]
        default: zip

permissions:
  contents: write

concurrency:
  group: sharknailtv-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Select build source
        env:
          REQUESTED_SOURCE: ${{ inputs.source }}
        run: |
          set -euo pipefail
          source="$REQUESTED_SOURCE"
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            # Push builds are always sourced from the uploaded archive; no fallback.
            source=zip
          fi
          case "$source" in
            repository)
              printf 'SOURCE_DIR=%s\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
              ;;
            repository-zip)
              git archive --format=zip --output="$RUNNER_TEMP/SharkNailTV.zip" HEAD app gradle build.gradle.kts settings.gradle.kts gradle.properties
              printf 'SOURCE_ZIP=%s\n' "$RUNNER_TEMP/SharkNailTV.zip" >> "$GITHUB_ENV"
              ;;
            zip)
              test -f incoming/SharkNailTV.zip
              printf 'SOURCE_ZIP=%s\n' "$GITHUB_WORKSPACE/incoming/SharkNailTV.zip" >> "$GITHUB_ENV"
              ;;
            *) echo "Unknown build source: $source"; exit 1 ;;
          esac
      - name: Extract Android project
        if: env.SOURCE_ZIP != ''
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile

          with ZipFile(os.environ['SOURCE_ZIP']) as archive:
              files = archive.infolist()
              if sum(item.file_size for item in files) > 2 * 1024**3:
                  raise SystemExit('Expanded ZIP exceeds 2 GiB')
              for item in files:
                  path = PurePosixPath(item.filename)
                  if path.is_absolute() or '..' in path.parts or '\\' in item.filename or '.git' in path.parts:
                      raise SystemExit(f'Unsafe archive path: {item.filename!r}')
              archive.extractall('zip-build')

          candidates = [path.parent for path in Path('zip-build').rglob('settings.gradle.kts')
                        if (path.parent / 'app/build.gradle.kts').is_file()]
          if len(candidates) != 1:
              raise SystemExit('Expected one Android project with settings.gradle.kts and app/build.gradle.kts')
          project = candidates[0].resolve()
          with Path(os.environ['GITHUB_ENV']).open('a') as env:
              print(f'SOURCE_DIR={project}', file=env)
          PY
      - name: Apply reviewed 4.0.1 through 4.1.0 fixes to the original archive
        if: env.SOURCE_ZIP != ''
        shell: bash
        run: |
          set -euo pipefail
          archive_sha=$(git hash-object "$SOURCE_ZIP")
          if [[ "$archive_sha" == "0ad470e7127d7cf3c97e4da31dd1e4a5915caf25" ]]; then
            base64 -d "$GITHUB_WORKSPACE/incoming/4.0.1.patch.gz.b64" | gzip -d > "$RUNNER_TEMP/shark401.patch"
            echo '4ed767fc9fabd22bb49ace0219257a4c6853e4b48a17535f71f852ce6f828cf1  '"$RUNNER_TEMP/shark401.patch" | sha256sum -c -
            cd "$SOURCE_DIR"
            patch -p1 --batch --forward --fuzz=0 --dry-run < "$RUNNER_TEMP/shark401.patch"
            patch -p1 --batch --forward --fuzz=0 < "$RUNNER_TEMP/shark401.patch"
            # Restore full-screen recovery handler removed by the performance patch.
            python - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/com/example/xtreamtv/MainActivity.kt")
          s = p.read_text()
          old = "    DisposableEffect(player,url) {\n        val started=android.os.SystemClock.elapsedRealtime()\n        var recoveryCount=0"
          new = "    DisposableEffect(player,url) {\n        val handler = android.os.Handler(player.applicationLooper)\n        val started=android.os.SystemClock.elapsedRealtime()\n        var recoveryCount=0"
          assert s.count(old) == 1, "Unexpected full-screen recovery code"
          p.write_text(s.replace(old, new, 1))
          PY
            grep -F 'orElse("4.0.1")' app/build.gradle.kts >/dev/null
            test -f app/src/main/java/com/example/xtreamtv/ProviderCache.kt
            python "$GITHUB_WORKSPACE/incoming/apply-4.0.2.py"
            grep -F 'orElse("4.0.2")' app/build.gradle.kts >/dev/null
            python "$GITHUB_WORKSPACE/incoming/apply-4.0.3.py"
            grep -F 'orElse("4.0.3")' app/build.gradle.kts >/dev/null
            python -m py_compile "$GITHUB_WORKSPACE/incoming/apply-4.0.4.py"
            python "$GITHUB_WORKSPACE/incoming/apply-4.0.4.py"
            python "$GITHUB_WORKSPACE/incoming/catalogue-4.0.4.py"
            python "$GITHUB_WORKSPACE/incoming/design-4.0.4.py"
            mkdir -p app/libs
            curl --fail --location --retry 3 --silent --show-error 'https://github.com/flow-vid/flowvid-ffmpeg-android/releases/download/v1.11.1-1/flowvid-media3-ffmpeg-v1.11.1-1.aar' -o app/libs/flowvid-media3-ffmpeg.aar
            echo '358bb85ae901d4245bb666becc1059a3ee8be138e16db9d3f6f19f5fde002c2c  app/libs/flowvid-media3-ffmpeg.aar' | sha256sum -c -
            unzip -tq app/libs/flowvid-media3-ffmpeg.aar
            grep -F 'orElse("4.0.4")' app/build.gradle.kts >/dev/null
            python "$GITHUB_WORKSPACE/incoming/preview-stability-next.py"
            grep -F 'orElse("4.0.5")' app/build.gradle.kts >/dev/null
            # Validate unified player source, including all SafePlayer call sites.
            python "$GITHUB_WORKSPACE/incoming/automatic-playback-4.0.6.py"
            grep -F 'orElse("4.0.6")' app/build.gradle.kts >/dev/null
            python "$GITHUB_WORKSPACE/incoming/native-buffer-4.0.7.py"
            grep -F 'orElse("4.0.7")' app/build.gradle.kts >/dev/null
            python - <<'PY'
          from pathlib import Path
          import re
          p=Path("app/build.gradle.kts")
          s=p.read_text()
          s,n=re.subn(r'(\bmedia3Version\s*=\s*)"1\.11\.1"',r'\g<1>"1.12.0-beta01"',s)
          assert n==1, "Stable Media3 version declaration not found"
          assert s.count('orElse("40007")')==1 and s.count('orElse("4.0.7")')==1
          s=s.replace('orElse("40007")','orElse("40008")').replace('orElse("4.0.7")','orElse("4.0.8")')
          assert 'applicationId = "com.example.xtreamtv"' in s
          p.write_text(s)
          print("Media3 1.12.0-beta01 selected; stable application ID retained")
          PY
            grep -F 'orElse("4.0.8")' app/build.gradle.kts >/dev/null
            # Preview-only unavailable-channel feedback and remote OK retry.
            python - <<'PY'
          from pathlib import Path
          import re
          p=Path("app/src/main/java/com/example/xtreamtv/MainActivity.kt")
          s=p.read_text()
          def swap(s,a,b):
              assert s.count(a)==1, "Unexpected 4.0.8 source: "+a[:120]
              return s.replace(a,b,1)
          s=swap(s,'    var preview by remember(api) { mutableStateOf<Entry?>(null) }','''    var preview by remember(api) { mutableStateOf<Entry?>(null) }
              var previewFailed by remember(api, preview?.id) { mutableStateOf(false) }
              var previewRetry by remember(api, preview?.id) { mutableIntStateOf(0) }''')
          s,n=re.subn(r'if\(previewEnabled && api!=null && preview\?\.id!=channel\.id\) preview=channel\s*\n\s*else onPlay\(channel\)','''if(previewEnabled && api!=null && preview?.id!=channel.id) preview=channel
                                      else if(previewEnabled && api!=null && previewFailed) {
                                          previewFailed=false
                                          previewRetry++
                                      } else onPlay(channel)''',s)
          assert n==1, "Channel OK action not found"
          # The archive uses a different wrapper around LivePreview than the repository source.
          # Find the invocation itself and preserve all original arguments and surrounding layout.
          start=s.index('@Composable private fun LivePreview(')
          calls=list(re.finditer(r'\bLivePreview\(',s[:start]))
          assert len(calls)==1, "Expected one LivePreview invocation; found "+str(len(calls))
          a=calls[0].start()
          opening=calls[0].end()-1
          depth=1
          i=opening+1
          quote=None
          escaped=False
          while i<len(s) and depth:
              ch=s[i]
              if quote:
                  if escaped: escaped=False
                  elif ch=='\\': escaped=True
                  elif ch==quote: quote=None
              elif ch in ('"', "'"): quote=ch
              elif ch=='(': depth+=1
              elif ch==')': depth-=1
              i+=1
          assert depth==0, "Unbalanced LivePreview invocation"
          args=s[opening+1:i-1].rstrip().rstrip(',')
          s=s[:a]+'key(previewRetry) { LivePreview('+args+', onFailureChange = { previewFailed=it }) }'+s[i:]
          n=1
          assert n==1, "Preview call not found"
          start=s.index('@Composable private fun LivePreview(')
          end=s.find('\n@Composable',start+1)
          if end<0: end=len(s)
          before,part,after=s[:start],s[start:end],s[end:]
          part=swap(part,'fun LivePreview(url:String)', 'fun LivePreview(url:String,onFailureChange:(Boolean)->Unit)')
          part=swap(part,'    var failed by remember(url){mutableStateOf(false)}','''    var failed by remember(url){mutableStateOf(false)}
              var renderedFrame by remember(url){mutableStateOf(false)}
              LaunchedEffect(failed) { onFailureChange(failed) }''')
          part=swap(part,'    DisposableEffect(player,url) {','''    LaunchedEffect(player,url) {
                  delay(20_000L)
                  if(!renderedFrame) failed=true
              }
              DisposableEffect(player,url) {''')
          part=swap(part,'            override fun onPlaybackStateChanged(state:Int) {','''            override fun onRenderedFirstFrame() {
                          renderedFrame=true
                          failed=false
                      }
                      override fun onPlaybackStateChanged(state:Int) {''')
          # Draw an opaque error overlay above the existing preview surface; keep normal playback unchanged.
          part,n=re.subn(r'if\s*\(failed\)\s*Text\([^\n]+', 'if(failed) Text("Channel unavailable — Press OK to retry", color=Color.White, fontSize=13.sp, modifier=Modifier.align(Alignment.Center).background(Color.Black).padding(12.dp))',part)
          assert n==1, "Existing preview failure label not found"
          s=before+part+after
          # Extend the already-tested account-scoped disk cache to Live TV.
          # Keep the same refresh rules and channel selection; cached data is provisional.
          s=swap(s,'''            if(catalogueKind!="live") {
                          a.cachedCategories(action)?.takeIf { it.isNotEmpty() }?.let {
                              categories=it
                              categoryId=it.first().first
                              categoriesLoading=false
                          }
                      }''','''            a.cachedCategories(action)?.takeIf { it.isNotEmpty() }?.let {
                          categories=it
                          if(categoryId==null || it.none { c -> c.first==categoryId }) categoryId=it.first().first
                          categoriesLoading=false
                      }''')
          s=swap(s,'''            if(catalogueKind!="live") {
                          a.cachedEntries(action,catalogueKind,id)?.takeIf { it.isNotEmpty() }?.let {
                              if(catalogueKind=="movie") movies=it else series=it
                              entriesLoading=false
                          }
                      }''','''            a.cachedEntries(action,catalogueKind,id)?.takeIf { it.isNotEmpty() }?.let {
                          when(catalogueKind) { "live" -> live=it; "movie" -> movies=it; else -> series=it }
                          entriesLoading=false
                      }''')
          # De-duplicate only once per channel list, rather than on every search keystroke.
          old='val filtered=remember(channels,query){channels.distinctBy { it.id }.filter { it.title.contains(query,true) }}'
          if s.count(old)==1:
              s=s.replace(old,'''val uniqueChannels=remember(channels) { channels.distinctBy { it.id } }
              val filtered=remember(uniqueChannels,query) { if(query.isBlank()) uniqueChannels else uniqueChannels.filter { it.title.contains(query,true) } }''',1)
              print("Channel search de-duplication moved outside per-query filtering")
          else:
              print("Channel search already differs from baseline; left unchanged")
          p.write_text(s)
          p=Path("app/build.gradle.kts")
          s=p.read_text()
          s=swap(s,'orElse("40008")','orElse("40009")')
          s=swap(s,'orElse("4.0.8")','orElse("4.0.9")')
          assert 'media3Version = "1.12.0-beta01"' in s
          p.write_text(s)
          print("Preview error feedback, live cache-first loading and OK retry applied; Media3 and buffering unchanged")
          PY
            grep -F 'orElse("4.0.9")' app/build.gradle.kts >/dev/null
            # Dedicated TV catalogue browser; leave the two Home landscape rows untouched.
            python - <<'PY'
          from pathlib import Path
          p=Path("app/src/main/java/com/example/xtreamtv/MainActivity.kt")
          s=p.read_text()
          def swap(s,a,b):
              assert s.count(a)==1, "Unexpected catalogue UI source: "+a[:120]
              return s.replace(a,b,1)
          s=swap(s,'import androidx.compose.foundation.lazy.LazyColumn','''import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.grid.LazyVerticalGrid
          import androidx.compose.foundation.lazy.grid.GridCells
          import androidx.compose.foundation.lazy.grid.items as gridItems
          import androidx.compose.foundation.lazy.grid.rememberLazyGridState''')
          # Find the catalogue box using stable inner marker and actual indentation.
          import re
          marker=s.index('val firstRow=remember(sectionEntries)')
          matches=list(re.finditer(r'(?m)^([ ]*)if\s*\(sectionEntries\.isNotEmpty\(\)\)\s*BoxWithConstraints\s*\(',s[:marker]))
          assert matches, "Could not locate catalogue box"
          match=matches[-1]
          start=match.start()
          end=re.search(r'(?m)^'+re.escape(match.group(1))+r'\}[ \t]*$',s[marker:])
          assert end, "Could not locate catalogue box end"
          stop=marker+end.end()
          old=s[start:stop]
          assert 'val firstRow=remember(sectionEntries)' in old and 'V4PosterRow(' in old, "Unexpected old catalogue rows"
          s=s[:start]+'''                                if(connected) TvCatalogueBrowser(
                                              modifier=Modifier.weight(1f).fillMaxWidth(),
                                              categories=categories, categoryId=categoryId, entries=sectionEntries,
                                              loading=catalogueLoading, onCategory={ categoryId=it },
                                              onRetry={api?.clearCatalogueCache();catalogueRetry++},
                                              onSelect={openTitle(it)}
                                          )'''+s[stop:]
          # Remove the duplicate category popup control; the new sidebar remains visible.
          old='if(connected && catalogueKind.isNotBlank() && section!="Shark TV")'
          if s.count(old)==1:
              s=s.replace(old,'if(connected && catalogueKind.isNotBlank() && section !in listOf("Shark TV","Movies","TV Series"))',1)
          # The existing empty state below the browser is preserved, including provider errors.
          anchor='@Composable private fun V4PosterRow('
          ui='''@Composable private fun TvCatalogueBrowser(
              modifier:Modifier=Modifier,
              categories:List<Pair<String,String>>,
              categoryId:String?,
              entries:List<Entry>,
              loading:Boolean,
              onCategory:(String)->Unit,
              onRetry:()->Unit,
              onSelect:(Entry)->Unit
          ) {
              var query by remember { mutableStateOf("") }
              var searching by remember { mutableStateOf(false) }
              var alphabetical by remember { mutableStateOf(false) }
              var focusedTitle by remember(categoryId) { mutableStateOf("") }
              val unique=remember(entries) { entries.distinctBy { it.kind+":"+it.id } }
              val uniqueCategories=remember(categories) { categories.distinctBy { it.first } }
              val visible=remember(unique,query,alphabetical) {
                  val matches=if(query.isBlank()) unique else unique.filter { it.title.contains(query,true) }
                  if(alphabetical) matches.sortedBy { it.title.lowercase(java.util.Locale.ROOT) } else matches
              }
              val categoryState=androidx.compose.foundation.lazy.rememberLazyListState()
              val gridState=rememberLazyGridState()
              LaunchedEffect(categoryId,visible.isNotEmpty()) { if(visible.isNotEmpty()) gridState.scrollToItem(0) }
              CompositionLocalProvider(androidx.compose.foundation.gestures.LocalBringIntoViewSpec provides KeepVisibleFocus) {
                  Row(modifier.clipToBounds().padding(horizontal=5.dp,vertical=3.dp),horizontalArrangement=Arrangement.spacedBy(10.dp)) {
                      Column(Modifier.weight(0.27f).fillMaxHeight().background(Color(0xE609152A)).padding(5.dp)) {
                          Text("Categories",color=Color.White,fontSize=15.sp,fontWeight=FontWeight.Medium,modifier=Modifier.padding(5.dp))
                          LazyColumn(state=categoryState,modifier=Modifier.weight(1f).fillMaxWidth().clipToBounds(),verticalArrangement=Arrangement.spacedBy(3.dp)) {
                              items(uniqueCategories,key={it.first}) { cat ->
                                  BrowserRow(cat.second,cat.first==categoryId,"",{},{
                                      query=""
                                      onCategory(cat.first)
                                  })
                              }
                          }
                          CompactLiveAction("Retry",Modifier.fillMaxWidth()){onRetry()}
                      }
                      Column(Modifier.weight(0.73f).fillMaxHeight().background(Color(0xA6081427)).padding(5.dp)) {
                          Row(Modifier.fillMaxWidth(),verticalAlignment=Alignment.CenterVertically,horizontalArrangement=Arrangement.spacedBy(6.dp)) {
                              Text(if(loading && visible.isEmpty()) "Loading…" else "Titles: "+visible.size,color=Color.White,fontSize=13.sp,modifier=Modifier.weight(1f))
                              CompactLiveAction(if(alphabetical) "Order: A–Z" else "Order: provider"){alphabetical=!alphabetical}
                              CompactLiveAction(if(searching) "Close search" else "Search"){searching=!searching;if(!searching)query=""}
                          }
                          if(searching) androidx.compose.material3.OutlinedTextField(value=query,onValueChange={query=it},singleLine=true,label={Text("Find title")},modifier=Modifier.fillMaxWidth())
                          Box(Modifier.weight(1f).fillMaxWidth()) {
                              LazyVerticalGrid(columns=GridCells.Adaptive(112.dp),state=gridState,
                                  modifier=Modifier.fillMaxSize().clipToBounds(),
                                  contentPadding=PaddingValues(4.dp),
                                  horizontalArrangement=Arrangement.spacedBy(7.dp),verticalArrangement=Arrangement.spacedBy(7.dp)) {
                                  gridItems(visible,key={it.kind+":"+it.id}) { entry ->
                                      var focused by remember { mutableStateOf(false) }
                                      var ready by remember(entry.image) { mutableStateOf(false) }
                                      Box(Modifier.fillMaxWidth().aspectRatio(2f/3f)
                                          .onFocusChanged { focused=it.isFocused;if(focused)focusedTitle=entry.title }
                                          .background(Color(0xFF101E33))
                                          .glassFrame(2.dp,if(focused)SharkFocusGold else Color(0xFF28649E),RoundedCornerShape(0.dp),focused=focused,repeatPulse=focused)
                                          .clickable {onSelect(entry)}.padding(3.dp)) {
                                          if(entry.image.isNotBlank()) AsyncImage(model=entry.image,contentDescription=entry.title,
                                              modifier=Modifier.fillMaxSize(),contentScale=ContentScale.Crop,
                                              onSuccess={ready=true},onError={ready=false})
                                          if(!ready) Text(entry.title,color=Color.White,fontSize=12.sp,maxLines=4,
                                              overflow=TextOverflow.Ellipsis,modifier=Modifier.align(Alignment.Center).padding(6.dp))
                                      }
                                  }
                              }
                              if(visible.isEmpty()) Text(if(loading) "Loading catalogue…" else "No matching titles",color=Color.White,fontSize=13.sp,modifier=Modifier.align(Alignment.Center))
                          }
                          Text(focusedTitle.ifBlank { uniqueCategories.firstOrNull { it.first==categoryId }?.second.orEmpty() },
                              color=Color.White,fontSize=13.sp,maxLines=1,overflow=TextOverflow.Ellipsis,modifier=Modifier.fillMaxWidth().padding(top=3.dp))
                      }
                  }
              }
          }

          '''
          s=swap(s,anchor,ui+anchor)
          # Privacy-safe session metrics; no URLs or credentials.
          p.write_text(s)
          p=Path("app/src/main/java/com/example/xtreamtv/PlaybackSettings.kt")
          s=p.read_text()
          lines=s.splitlines(keepends=True)
          builders=[n for n,line in enumerate(lines) if 'return ExoPlayer.Builder(' in line and '.build().apply {' in line]
          assert len(builders)==1, "Unexpected player builder"
          n=builders[0]
          lines.insert(n+1,'''        addAnalyticsListener(androidx.media3.exoplayer.analytics.PlaybackStatsListener(false) { _, stats ->
                      android.util.Log.d("SharkPlaybackStats", "preview="+preview+" startupMs="+stats.meanJoinTimeMs+
                          " rebufferCount="+stats.totalRebufferCount+" droppedFrames="+stats.totalDroppedFrames)
                  })
          ''')
          p.write_text(''.join(lines))
          p=Path("app/build.gradle.kts")
          s=p.read_text()
          s=swap(s,'orElse("40009")','orElse("40100")')
          s=swap(s,'orElse("4.0.9")','orElse("4.1.0")')
          p.write_text(s)
          print("Movies and TV Series use a lazy poster grid, persistent sidebar, title search and sorting. Home unchanged.")
          PY
            grep -F 'orElse("4.1.0")' app/build.gradle.kts >/dev/null
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 37
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f -print -quit)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" 'platforms;android-37.0' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Prepare version and optional signing
        env:
          SHARK_KEYSTORE_B64: ${{ secrets.SHARK_KEYSTORE_B64 }}
          SHARK_SIGNING_BUNDLE: ${{ secrets.SHARK_SIGNING_BUNDLE }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          floor=30000
          if [[ -n "${SOURCE_ZIP:-}" ]]; then floor=40099; fi
          code=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name' |
            python -c 'import re,sys; versions = [tuple(map(int, m.groups(default="0"))) for line in sys.stdin if (m := re.fullmatch(r"v?(\d{1,2})\.(\d{1,2})(?:\.(\d{1,2}))?", line.strip()))]; print(max([int(sys.argv[1])] + [a*10000+b*100+c for a,b,c in versions]) + 1)' "$floor")
          version="$((code / 10000)).$((code / 100 % 100)).$((code % 100))"
          printf 'VERSION_CODE=%s\nVERSION_NAME=%s\n' "$code" "$version" >> "$GITHUB_ENV"
          if [[ -n "$SHARK_KEYSTORE_B64" ]]; then
            umask 077
            printf '%s' "$SHARK_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/shark-updates.jks"
            printf 'SHARK_KEYSTORE_PATH=%s\n' "$RUNNER_TEMP/shark-updates.jks" >> "$GITHUB_ENV"
          elif [[ -z "$SHARK_SIGNING_BUNDLE" ]]; then
            echo 'OTA signing key is unavailable. This run will produce a debug APK.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Build installable APK
        env:
          SHARK_SIGNING_BUNDLE: ${{ secrets.SHARK_SIGNING_BUNDLE }}
          SHARK_KEYSTORE_PASSWORD: ${{ secrets.SHARK_KEYSTORE_PASSWORD }}
          SHARK_KEY_ALIAS: ${{ secrets.SHARK_KEY_ALIAS }}
          SHARK_KEY_PASSWORD: ${{ secrets.SHARK_KEY_PASSWORD }}
          SPORTS_API_KEY: ${{ secrets.SPORTS_API_KEY }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"
          if [[ -n "$TMDB_API_KEY" ]]; then
            printf 'TMDB_API_KEY=%s\n' "$TMDB_API_KEY" > tmdb.properties
          elif [[ ! -f tmdb.properties && -f "$GITHUB_WORKSPACE/tmdb.properties" ]]; then
            cp "$GITHUB_WORKSPACE/tmdb.properties" tmdb.properties
          fi
          if [[ -n "${SOURCE_ZIP:-}" ]]; then test -s tmdb.properties; fi
          if [[ -n "$SPORTS_API_KEY" ]]; then printf 'SPORTS_API_KEY=%s\n' "$SPORTS_API_KEY" > sports.properties; fi
          if [[ -n "$SHARK_SIGNING_BUNDLE" ]]; then
            export SHARK_KEYSTORE_PATH="$RUNNER_TEMP/sharknailtv.p12"
            umask 077
            SHARK_KEYSTORE_PASSWORD=$(python - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path

          bundle = json.loads(os.environ['SHARK_SIGNING_BUNDLE'].strip(), strict=False)
          key = ''.join(bundle['keystore'].split())
          Path(os.environ['SHARK_KEYSTORE_PATH']).write_bytes(base64.b64decode(key, validate=True))
          print(''.join(bundle['password'].split()))
          PY
            )
            echo "::add-mask::$SHARK_KEYSTORE_PASSWORD"
            export SHARK_KEYSTORE_PASSWORD
            export SHARK_KEY_PASSWORD="$SHARK_KEYSTORE_PASSWORD"
            export SHARK_KEY_ALIAS=sharknailtv
          fi
          unset SHARK_SIGNING_BUNDLE
          if [[ -z "${SHARK_KEYSTORE_PATH:-}" ]]; then
            if [[ "$GITHUB_EVENT_NAME" == push ]]; then echo "::error::Permanent signing key missing"; exit 1; fi
            gradle --no-daemon :app:assembleDebug -PSHARK_VERSION_CODE="$VERSION_CODE" -PSHARK_VERSION_NAME="$VERSION_NAME"
            cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/SharkNailTV-debug.apk"
            exit 0
          fi
          : "${SHARK_KEYSTORE_PASSWORD:?Missing SHARK_KEYSTORE_PASSWORD}"
          : "${SHARK_KEY_ALIAS:?Missing SHARK_KEY_ALIAS}"
          : "${SHARK_KEY_PASSWORD:?Missing SHARK_KEY_PASSWORD}"
          gradle --no-daemon :app:assembleRelease -PSHARK_VERSION_CODE="$VERSION_CODE" -PSHARK_VERSION_NAME="$VERSION_NAME"
          tools="$ANDROID_HOME/build-tools/36.0.0"
          shopt -s nullglob
          apks=(app/build/outputs/apk/release/*.apk)
          [[ ${#apks[@]} == 1 ]]
          "$tools/zipalign" -P 16 -f 4 "${apks[0]}" "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" sign --ks "$SHARK_KEYSTORE_PATH" --ks-key-alias "$SHARK_KEY_ALIAS" --ks-pass env:SHARK_KEYSTORE_PASSWORD --key-pass env:SHARK_KEY_PASSWORD --out "$GITHUB_WORKSPACE/SharkNailTV.apk" "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" verify --print-certs "$GITHUB_WORKSPACE/SharkNailTV.apk"
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            cert=$("$tools/apksigner" verify --print-certs "$GITHUB_WORKSPACE/SharkNailTV.apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
            [[ "$cert" == "14fea534b29f1196c0a2fcb0618cde8f6391ad6e9153a941fd8c86e3cb0fca96" ]] || { echo "::error::Signing certificate does not match installed 3.4.8"; exit 1; }
          fi
          badging=$("$tools/aapt" dump badging "$GITHUB_WORKSPACE/SharkNailTV.apk")
          [[ "$badging" == *"package: name='com.example.xtreamtv' versionCode='$VERSION_CODE'"* ]]
      - uses: actions/upload-artifact@v4
        with:
          name: SharkNailTV-APK
          path: SharkNailTV*.apk
          if-no-files-found: error

      - name: Verify complete 4.1.0 beta package and FFmpeg fallback
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          test "$VERSION_NAME" = "4.1.0"
          test -f "$SOURCE_DIR/app/src/main/res/layout/shark_sdr_player.xml"
          grep -F 'EXTENSION_RENDERER_MODE_ON' "$SOURCE_DIR/app/src/main/java/com/example/xtreamtv/PlaybackSettings.kt"
          grep -F 'implementation(files("libs/flowvid-media3-ffmpeg.aar"))' "$SOURCE_DIR/app/build.gradle.kts"
          python - <<'PY'
          import os
          from zipfile import ZipFile
          with ZipFile(os.path.join(os.environ['GITHUB_WORKSPACE'],'SharkNailTV.apk')) as apk:
              assert apk.testzip() is None, "APK ZIP integrity failure"
              files = set(apk.namelist())
              for abi in ('arm64-v8a','armeabi-v7a','x86','x86_64'):
                  assert 'lib/'+abi+'/libffmpegJNI.so' in files, "Missing FFmpeg for "+abi
              assert 'assets/ffmpeg-source-notice.txt' in files
              assert any(b'FfmpegAudioRenderer' in apk.read(f) for f in files if f.startswith('classes') and f.endswith('.dex')), "FFmpeg renderer missing from DEX"
          print('FFmpeg native ABIs, DEX, licensing notice and APK integrity verified')
          PY
      - name: Install and launch signed APK on Android emulator
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f -print -quit)"
          "$sdkmanager" "emulator" "platform-tools" "system-images;android-35;google_apis;x86_64"
          avdmanager="$(find "$ANDROID_HOME/cmdline-tools" -name avdmanager -type f -print -quit)"
          export ANDROID_USER_HOME="$RUNNER_TEMP/shark-android"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$avdmanager" create avd --force -n shark-smoke -p "$ANDROID_AVD_HOME/shark-smoke.avd" -k "system-images;android-35;google_apis;x86_64"
          test -s "$ANDROID_AVD_HOME/shark-smoke.avd/config.ini"
          # Explicitly write the discovery record, independent of avdmanager's user-home selection.
          printf 'avd.ini.encoding=UTF-8\npath=%s\npath.rel=avd/shark-smoke.avd\ntarget=android-35\n' "$ANDROID_AVD_HOME/shark-smoke.avd" > "$ANDROID_AVD_HOME/shark-smoke.ini"
          "$ANDROID_HOME/emulator/emulator" -list-avds | grep -Fx shark-smoke
          if [[ -e /dev/kvm ]]; then sudo chmod a+rw /dev/kvm; fi
          adb="$ANDROID_HOME/platform-tools/adb"
          emulator="$ANDROID_HOME/emulator/emulator"
          "$adb" start-server
          "$emulator" -accel-check || true
          accel=off
          if [[ -r /dev/kvm && -w /dev/kvm ]] && "$emulator" -accel-check >/dev/null 2>&1; then accel=on; fi
          echo "Emulator acceleration: $accel"
          "$emulator" -avd shark-smoke -port 5554 -accel "$accel" -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader -memory 2048 -verbose > "$RUNNER_TEMP/emulator.log" 2>&1 &
          emu_pid=$!
          trap 'result=$?; tail -100 "$RUNNER_TEMP/emulator.log" || true; kill "$emu_pid" 2>/dev/null || true; exit "$result"' EXIT
          export ANDROID_SERIAL=emulator-5554
          ready=false
          for i in $(seq 1 180); do
            if ! kill -0 "$emu_pid" 2>/dev/null; then echo "::error::Emulator process exited before boot"; exit 1; fi
            if [[ "$(timeout 8 "$adb" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)" == "1" ]]; then ready=true; break; fi
            sleep 5
          done
          test "$ready" = true || { echo "::error::Emulator boot timed out"; exit 1; }
          "$adb" shell input keyevent 82
          "$adb" install -r "$GITHUB_WORKSPACE/SharkNailTV.apk"
          "$adb" logcat -c
          "$adb" shell am start -W -n com.example.xtreamtv/.MainActivity
          sleep 12
          "$adb" shell pidof com.example.xtreamtv
          "$adb" shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity' | grep 'com.example.xtreamtv'
          "$adb" logcat -d -b crash > "$RUNNER_TEMP/shark-crash.log"
          if grep -F 'Process: com.example.xtreamtv' "$RUNNER_TEMP/shark-crash.log"; then
            cat "$RUNNER_TEMP/shark-crash.log"
            exit 1
          fi
          echo 'Signed APK installed and launched without a detected application crash.'
      - name: Publish signed ZIP OTA
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          test -f SharkNailTV.apk
          test -n "${SOURCE_ZIP:-}"
          test "${VERSION_CODE:?}" -ge 40000
          python - <<'PY'
          import json, os
          from pathlib import Path
          tag = "v" + os.environ["VERSION_NAME"]
          url = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{tag}/SharkNailTV.apk"
          Path("update.json").write_text(json.dumps({"tag_name": tag, "draft": False, "prerelease": False, "assets": [{"name": "SharkNailTV.apk", "browser_download_url": url}]}), encoding="utf-8")
          PY
          gh release create "v$VERSION_NAME" SharkNailTV.apk update.json --target "$GITHUB_SHA" --title "SharkNailTV $VERSION_NAME (Media3 beta test)" --notes "Dedicated Movies/Series catalogue with persistent category sidebar, vertically scrolling lazy poster grid, title search, sorting and provider artwork; Home layout unchanged. Live TV now uses account-scoped cache-first category and channel loading, retaining background refresh and selection. Preview failures display Channel unavailable — Press OK to retry; OK retries the same failed channel, with a 20-second no-first-frame timeout. Native ExoPlayer full-screen buffer defaults replace custom buffering and legacy playback profiles, preserving prior preview and SDR improvements. Decoder fallback clearly labelled. Preview-only buffer adjustment, fixed 1x playback speed, no preview refresh-rate switching and reduced subtitle processing. EXPERIMENTAL Media3 1.12.0-beta01 with existing 1.11.1-built LGPL FFmpeg audio fallback; FFmpeg runtime compatibility is not yet verified, bounded memory caches, transient live reconnect, OK-to-play channels, cache-first catalogues, premium darker channel rows, taller Settings, unused media cleanup, preserved SDR and Time settings. Signed APK integrity and emulator launch checked. FFmpeg source and notices: https://github.com/flow-vid/flowvid-ffmpeg-android/tree/v1.11.1-1 . TV playback and performance require device testing." --latest
