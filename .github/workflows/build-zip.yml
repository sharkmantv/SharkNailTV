name: Build SharkNailTV ZIP and publish OTA on upload

on:
  push:
    branches: [main]
    paths:
      - 'incoming/SharkNailTV.zip'
      - '.github/workflows/build-zip.yml'
  workflow_dispatch:
    inputs:
      source:
        description: Android source to build
        type: choice
        options: [repository, zip, repository-zip]
        default: zip

permissions:
  contents: write

concurrency:
  group: sharknailtv-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Select build source
        env:
          REQUESTED_SOURCE: ${{ inputs.source }}
        run: |
          set -euo pipefail
          source="$REQUESTED_SOURCE"
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            # Push builds are always sourced from the uploaded archive; no fallback.
            source=zip
          fi
          case "$source" in
            repository)
              printf 'SOURCE_DIR=%s\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
              ;;
            repository-zip)
              git archive --format=zip --output="$RUNNER_TEMP/SharkNailTV.zip" HEAD app gradle build.gradle.kts settings.gradle.kts gradle.properties
              printf 'SOURCE_ZIP=%s\n' "$RUNNER_TEMP/SharkNailTV.zip" >> "$GITHUB_ENV"
              ;;
            zip)
              test -f incoming/SharkNailTV.zip
              printf 'SOURCE_ZIP=%s\n' "$GITHUB_WORKSPACE/incoming/SharkNailTV.zip" >> "$GITHUB_ENV"
              ;;
            *) echo "Unknown build source: $source"; exit 1 ;;
          esac
      - name: Extract Android project
        if: env.SOURCE_ZIP != ''
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile

          with ZipFile(os.environ['SOURCE_ZIP']) as archive:
              files = archive.infolist()
              if sum(item.file_size for item in files) > 2 * 1024**3:
                  raise SystemExit('Expanded ZIP exceeds 2 GiB')
              for item in files:
                  path = PurePosixPath(item.filename)
                  if path.is_absolute() or '..' in path.parts or '\\' in item.filename or '.git' in path.parts:
                      raise SystemExit(f'Unsafe archive path: {item.filename!r}')
              archive.extractall('zip-build')

          candidates = [path.parent for path in Path('zip-build').rglob('settings.gradle.kts')
                        if (path.parent / 'app/build.gradle.kts').is_file()]
          if len(candidates) != 1:
              raise SystemExit('Expected one Android project with settings.gradle.kts and app/build.gradle.kts')
          project = candidates[0].resolve()
          with Path(os.environ['GITHUB_ENV']).open('a') as env:
              print(f'SOURCE_DIR={project}', file=env)
          PY
      - name: Apply reviewed 4.0.1 through 4.0.4 fixes to the original archive
        if: env.SOURCE_ZIP != ''
        shell: bash
        run: |
          set -euo pipefail
          archive_sha=$(git hash-object "$SOURCE_ZIP")
          if [[ "$archive_sha" == "0ad470e7127d7cf3c97e4da31dd1e4a5915caf25" ]]; then
            base64 -d "$GITHUB_WORKSPACE/incoming/4.0.1.patch.gz.b64" | gzip -d > "$RUNNER_TEMP/shark401.patch"
            echo '4ed767fc9fabd22bb49ace0219257a4c6853e4b48a17535f71f852ce6f828cf1  '"$RUNNER_TEMP/shark401.patch" | sha256sum -c -
            cd "$SOURCE_DIR"
            patch -p1 --batch --forward --fuzz=0 --dry-run < "$RUNNER_TEMP/shark401.patch"
            patch -p1 --batch --forward --fuzz=0 < "$RUNNER_TEMP/shark401.patch"
            # Restore full-screen recovery handler removed by the performance patch.
            python - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/com/example/xtreamtv/MainActivity.kt")
          s = p.read_text()
          old = "    DisposableEffect(player,url) {\n        val started=android.os.SystemClock.elapsedRealtime()\n        var recoveryCount=0"
          new = "    DisposableEffect(player,url) {\n        val handler = android.os.Handler(player.applicationLooper)\n        val started=android.os.SystemClock.elapsedRealtime()\n        var recoveryCount=0"
          assert s.count(old) == 1, "Unexpected full-screen recovery code"
          p.write_text(s.replace(old, new, 1))
          PY
            grep -F 'orElse("4.0.1")' app/build.gradle.kts >/dev/null
            test -f app/src/main/java/com/example/xtreamtv/ProviderCache.kt
            python "$GITHUB_WORKSPACE/incoming/apply-4.0.2.py"
            grep -F 'orElse("4.0.2")' app/build.gradle.kts >/dev/null
            python "$GITHUB_WORKSPACE/incoming/apply-4.0.3.py"
            grep -F 'orElse("4.0.3")' app/build.gradle.kts >/dev/null
            python -m py_compile "$GITHUB_WORKSPACE/incoming/apply-4.0.4.py"
            python "$GITHUB_WORKSPACE/incoming/apply-4.0.4.py"
            grep -F 'orElse("4.0.4")' app/build.gradle.kts >/dev/null
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 37
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f -print -quit)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" 'platforms;android-37.0' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Prepare version and optional signing
        env:
          SHARK_KEYSTORE_B64: ${{ secrets.SHARK_KEYSTORE_B64 }}
          SHARK_SIGNING_BUNDLE: ${{ secrets.SHARK_SIGNING_BUNDLE }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          floor=30000
          if [[ -n "${SOURCE_ZIP:-}" ]]; then floor=39999; fi
          code=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name' |
            python -c 'import re,sys; versions = [tuple(map(int, m.groups(default="0"))) for line in sys.stdin if (m := re.fullmatch(r"v?(\d{1,2})\.(\d{1,2})(?:\.(\d{1,2}))?", line.strip()))]; print(max([int(sys.argv[1])] + [a*10000+b*100+c for a,b,c in versions]) + 1)' "$floor")
          version="$((code / 10000)).$((code / 100 % 100)).$((code % 100))"
          printf 'VERSION_CODE=%s\nVERSION_NAME=%s\n' "$code" "$version" >> "$GITHUB_ENV"
          if [[ -n "$SHARK_KEYSTORE_B64" ]]; then
            umask 077
            printf '%s' "$SHARK_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/shark-updates.jks"
            printf 'SHARK_KEYSTORE_PATH=%s\n' "$RUNNER_TEMP/shark-updates.jks" >> "$GITHUB_ENV"
          elif [[ -z "$SHARK_SIGNING_BUNDLE" ]]; then
            echo 'OTA signing key is unavailable. This run will produce a debug APK.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Build installable APK
        env:
          SHARK_SIGNING_BUNDLE: ${{ secrets.SHARK_SIGNING_BUNDLE }}
          SHARK_KEYSTORE_PASSWORD: ${{ secrets.SHARK_KEYSTORE_PASSWORD }}
          SHARK_KEY_ALIAS: ${{ secrets.SHARK_KEY_ALIAS }}
          SHARK_KEY_PASSWORD: ${{ secrets.SHARK_KEY_PASSWORD }}
          SPORTS_API_KEY: ${{ secrets.SPORTS_API_KEY }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"
          if [[ -n "$TMDB_API_KEY" ]]; then
            printf 'TMDB_API_KEY=%s\n' "$TMDB_API_KEY" > tmdb.properties
          elif [[ ! -f tmdb.properties && -f "$GITHUB_WORKSPACE/tmdb.properties" ]]; then
            cp "$GITHUB_WORKSPACE/tmdb.properties" tmdb.properties
          fi
          if [[ -n "${SOURCE_ZIP:-}" ]]; then test -s tmdb.properties; fi
          if [[ -n "$SPORTS_API_KEY" ]]; then printf 'SPORTS_API_KEY=%s\n' "$SPORTS_API_KEY" > sports.properties; fi
          if [[ -n "$SHARK_SIGNING_BUNDLE" ]]; then
            export SHARK_KEYSTORE_PATH="$RUNNER_TEMP/sharknailtv.p12"
            umask 077
            SHARK_KEYSTORE_PASSWORD=$(python - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path

          bundle = json.loads(os.environ['SHARK_SIGNING_BUNDLE'].strip(), strict=False)
          key = ''.join(bundle['keystore'].split())
          Path(os.environ['SHARK_KEYSTORE_PATH']).write_bytes(base64.b64decode(key, validate=True))
          print(''.join(bundle['password'].split()))
          PY
            )
            echo "::add-mask::$SHARK_KEYSTORE_PASSWORD"
            export SHARK_KEYSTORE_PASSWORD
            export SHARK_KEY_PASSWORD="$SHARK_KEYSTORE_PASSWORD"
            export SHARK_KEY_ALIAS=sharknailtv
          fi
          unset SHARK_SIGNING_BUNDLE
          if [[ -z "${SHARK_KEYSTORE_PATH:-}" ]]; then
            if [[ "$GITHUB_EVENT_NAME" == push ]]; then echo "::error::Permanent signing key missing"; exit 1; fi
            gradle --no-daemon :app:assembleDebug -PSHARK_VERSION_CODE="$VERSION_CODE" -PSHARK_VERSION_NAME="$VERSION_NAME"
            cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/SharkNailTV-debug.apk"
            exit 0
          fi
          : "${SHARK_KEYSTORE_PASSWORD:?Missing SHARK_KEYSTORE_PASSWORD}"
          : "${SHARK_KEY_ALIAS:?Missing SHARK_KEY_ALIAS}"
          : "${SHARK_KEY_PASSWORD:?Missing SHARK_KEY_PASSWORD}"
          gradle --no-daemon :app:assembleRelease -PSHARK_VERSION_CODE="$VERSION_CODE" -PSHARK_VERSION_NAME="$VERSION_NAME"
          tools="$ANDROID_HOME/build-tools/36.0.0"
          shopt -s nullglob
          apks=(app/build/outputs/apk/release/*.apk)
          [[ ${#apks[@]} == 1 ]]
          "$tools/zipalign" -P 16 -f 4 "${apks[0]}" "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" sign --ks "$SHARK_KEYSTORE_PATH" --ks-key-alias "$SHARK_KEY_ALIAS" --ks-pass env:SHARK_KEYSTORE_PASSWORD --key-pass env:SHARK_KEY_PASSWORD --out "$GITHUB_WORKSPACE/SharkNailTV.apk" "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" verify --print-certs "$GITHUB_WORKSPACE/SharkNailTV.apk"
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            cert=$("$tools/apksigner" verify --print-certs "$GITHUB_WORKSPACE/SharkNailTV.apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
            [[ "$cert" == "14fea534b29f1196c0a2fcb0618cde8f6391ad6e9153a941fd8c86e3cb0fca96" ]] || { echo "::error::Signing certificate does not match installed 3.4.8"; exit 1; }
          fi
          badging=$("$tools/aapt" dump badging "$GITHUB_WORKSPACE/SharkNailTV.apk")
          [[ "$badging" == *"package: name='com.example.xtreamtv' versionCode='$VERSION_CODE'"* ]]
      - uses: actions/upload-artifact@v4
        with:
          name: SharkNailTV-APK
          path: SharkNailTV*.apk
          if-no-files-found: error

      - name: Verify complete 4.0.4 package and FFmpeg fallback
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          test "$VERSION_NAME" = "4.0.4"
          test -f "$SOURCE_DIR/app/src/main/res/layout/shark_sdr_player.xml"
          grep -F 'EXTENSION_RENDERER_MODE_ON' "$SOURCE_DIR/app/src/main/java/com/example/xtreamtv/PlaybackSettings.kt"
          grep -F 'io.put:media3-ffmpeg-decoder:1.11.1+1' "$SOURCE_DIR/app/build.gradle.kts"
          python - <<'PY'
          import os
          from zipfile import ZipFile
          with ZipFile(os.path.join(os.environ['GITHUB_WORKSPACE'],'SharkNailTV.apk')) as apk:
              assert apk.testzip() is None, "APK ZIP integrity failure"
              files = set(apk.namelist())
              for abi in ('arm64-v8a','armeabi-v7a','x86','x86_64'):
                  assert 'lib/'+abi+'/libffmpegJNI.so' in files, "Missing FFmpeg for "+abi
              assert 'assets/ffmpeg-source-notice.txt' in files
              assert any(b'FfmpegAudioRenderer' in apk.read(f) for f in files if f.startswith('classes') and f.endswith('.dex')), "FFmpeg renderer missing from DEX"
          print('FFmpeg native ABIs, DEX, licensing notice and APK integrity verified')
          PY
      - name: Install and launch signed APK on Android emulator
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f -print -quit)"
          "$sdkmanager" "emulator" "platform-tools" "system-images;android-35;google_apis;x86_64"
          avdmanager="$(find "$ANDROID_HOME/cmdline-tools" -name avdmanager -type f -print -quit)"
          echo no | "$avdmanager" create avd --force -n shark-smoke -k "system-images;android-35;google_apis;x86_64"
          if [[ -e /dev/kvm ]]; then sudo chmod a+rw /dev/kvm; fi
          "$ANDROID_HOME/emulator/emulator" -avd shark-smoke -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect > "$RUNNER_TEMP/emulator.log" 2>&1 &
          emu_pid=$!
          trap 'kill "$emu_pid" 2>/dev/null || true' EXIT
          adb="$ANDROID_HOME/platform-tools/adb"
          timeout 240 "$adb" wait-for-device
          for i in $(seq 1 120); do
            [[ "$("$adb" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == "1" ]] && break
            sleep 2
          done
          test "$("$adb" shell getprop sys.boot_completed | tr -d '\r')" = "1"
          "$adb" shell input keyevent 82
          "$adb" install -r "$GITHUB_WORKSPACE/SharkNailTV.apk"
          "$adb" logcat -c
          "$adb" shell am start -W -n com.example.xtreamtv/.MainActivity
          sleep 12
          "$adb" shell pidof com.example.xtreamtv
          "$adb" shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity' | grep 'com.example.xtreamtv'
          "$adb" logcat -d -b crash > "$RUNNER_TEMP/shark-crash.log"
          if grep -F 'Process: com.example.xtreamtv' "$RUNNER_TEMP/shark-crash.log"; then
            cat "$RUNNER_TEMP/shark-crash.log"
            exit 1
          fi
          echo 'Signed APK installed and launched without a detected application crash.'
      - name: Publish signed ZIP OTA
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          test -f SharkNailTV.apk
          test -n "${SOURCE_ZIP:-}"
          test "${VERSION_CODE:?}" -ge 40000
          python - <<'PY'
          import json, os
          from pathlib import Path
          tag = "v" + os.environ["VERSION_NAME"]
          url = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{tag}/SharkNailTV.apk"
          Path("update.json").write_text(json.dumps({"tag_name": tag, "draft": False, "prerelease": False, "assets": [{"name": "SharkNailTV.apk", "browser_download_url": url}]}), encoding="utf-8")
          PY
          gh release create "v$VERSION_NAME" SharkNailTV.apk update.json --target "$GITHUB_SHA" --title "SharkNailTV $VERSION_NAME" --notes "Consolidated performance and stability update. Media3 1.11.1 with LGPL FFmpeg audio fallback, bounded memory caches, transient live reconnect, unused media cleanup, preserved SDR and Time settings. Signed APK integrity and emulator launch checked. FFmpeg source and notices: https://github.com/putdotio/media3-ffmpeg-decoder . TV playback and performance require device testing." --latest
