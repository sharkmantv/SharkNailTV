          PY
          gh release create "v$VERSION_NAME" SharkNailTV.apk update.json --target "$GITHUB_SHA" --title "SharkNailTV $VERSION_NAME" --notes "SharkNailTV $VERSION_NAME source ZIP update" --latest
 +'''{parseEpgTime(programme.start)?.let { guideClock(context,it) }.orEmpty()}  '''+ '          fi
