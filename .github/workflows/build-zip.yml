name: Build SharkNailTV ZIP and publish OTA on upload

on:
  push:
    branches: [main, 'development/4.1.15-performance']
    paths:
      - 'incoming/SharkNailTV.zip'
      - 'incoming/room-catalogue-4.1.11.py'
      - 'incoming/preload-4.1.11.py'
      - 'incoming/build-video-decoders-4.1.11.sh'
      - 'incoming/performance-audit-4.1.12.py'
      - 'incoming/playback-performance-4.1.13.py'
      - 'incoming/home-performance-4.1.14.py'
      - 'incoming/player-ui-4.1.15.py'
      - 'incoming/SharkNailTV-4.1.14-home-assets.zip'
      - 'incoming/SharkNailTV-4.1.15-home-png.zip'
      - '.github/workflows/build-zip.yml'
  workflow_dispatch:
    inputs:
      source:
        description: Android source to build
        type: choice
        options: [repository, zip, repository-zip]
        default: zip

permissions:
  contents: write

concurrency:
  group: sharknailtv-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - name: Select build source
        env:
          REQUESTED_SOURCE: ${{ inputs.source }}
        run: |
          set -euo pipefail
          source="$REQUESTED_SOURCE"
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            # Push builds are always sourced from the uploaded archive; no fallback.
            source=zip
          fi
          case "$source" in
            repository)
              printf 'SOURCE_DIR=%s\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
              ;;
            repository-zip)
              git archive --format=zip --output="$RUNNER_TEMP/SharkNailTV.zip" HEAD app gradle build.gradle.kts settings.gradle.kts gradle.properties
              printf 'SOURCE_ZIP=%s\n' "$RUNNER_TEMP/SharkNailTV.zip" >> "$GITHUB_ENV"
              ;;
            zip)
              test -f incoming/SharkNailTV.zip
              printf 'SOURCE_ZIP=%s\n' "$GITHUB_WORKSPACE/incoming/SharkNailTV.zip" >> "$GITHUB_ENV"
              ;;
            *) echo "Unknown build source: $source"; exit 1 ;;
          esac
      - name: Extract Android project
        if: env.SOURCE_ZIP != ''
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile

          with ZipFile(os.environ['SOURCE_ZIP']) as archive:
              files = archive.infolist()
              if sum(item.file_size for item in files) > 2 * 1024**3:
                  raise SystemExit('Expanded ZIP exceeds 2 GiB')
              for item in files:
                  path = PurePosixPath(item.filename)
                  if path.is_absolute() or '..' in path.parts or '\\' in item.filename or '.git' in path.parts:
                      raise SystemExit(f'Unsafe archive path: {item.filename!r}')
              archive.extractall('zip-build')

          candidates = [path.parent for path in Path('zip-build').rglob('settings.gradle.kts')
                        if (path.parent / 'app/build.gradle.kts').is_file()]
          if len(candidates) != 1:
              raise SystemExit('Expected one Android project with settings.gradle.kts and app/build.gradle.kts')
          project = candidates[0].resolve()
          with Path(os.environ['GITHUB_ENV']).open('a') as env:
              print(f'SOURCE_DIR={project}', file=env)
          PY
      - name: Apply reviewed 4.0.1 through 4.1.15 fixes to the original archive
        if: env.SOURCE_ZIP != ''
        shell: bash
        run: |
          set -euo pipefail
          archive_sha=$(git hash-object "$SOURCE_ZIP")
          test -s "$GITHUB_WORKSPACE/incoming/SharkNailTV-4.1.14-home-assets.zip" || { echo '::error::Approved Home artwork archive is missing; no APK will be produced.'; exit 1; }
          if [[ "$archive_sha" == "0ad470e7127d7cf3c97e4da31dd1e4a5915caf25" ]]; then
            base64 -d "$GITHUB_WORKSPACE/incoming/4.0.1.patch.gz.b64" | gzip -d > "$RUNNER_TEMP/shark401.patch"
            echo '4ed767fc9fabd22bb49ace0219257a4c6853e4b48a17535f71f852ce6f828cf1  '"$RUNNER_TEMP/shark401.patch" | sha256sum -c -
            cd "$SOURCE_DIR"
            patch -p1 --batch --forward --fuzz=0 --dry-run < "$RUNNER_TEMP/shark401.patch"
            patch -p1 --batch --forward --fuzz=0 < "$RUNNER_TEMP/shark401.patch"
            # Restore full-screen recovery handler removed by the performance patch.
            python - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/com/example/xtreamtv/MainActivity.kt")
          s = p.read_text()
          old = "    DisposableEffect(player,url) {\n        val started=android.os.SystemClock.elapsedRealtime()\n        var recoveryCount=0"
          new = "    DisposableEffect(player,url) {\n        val handler = android.os.Handler(player.applicationLooper)\n        val started=android.os.SystemClock.elapsedRealtime()\n        var recoveryCount=0"
          assert s.count(old) == 1, "Unexpected full-screen recovery code"
          p.write_text(s.replace(old, new, 1))
          PY
            grep -F 'orElse("4.0.1")' app/build.gradle.kts >/dev/null
            test -f app/src/main/java/com/example/xtreamtv/ProviderCache.kt
            python "$GITHUB_WORKSPACE/incoming/apply-4.0.2.py"
            grep -F 'orElse("4.0.2")' app/build.gradle.kts >/dev/null
            python "$GITHUB_WORKSPACE/incoming/apply-4.0.3.py"
            grep -F 'orElse("4.0.3")' app/build.gradle.kts >/dev/null
            python -m py_compile "$GITHUB_WORKSPACE/incoming/apply-4.0.4.py"
            python "$GITHUB_WORKSPACE/incoming/apply-4.0.4.py"
            python "$GITHUB_WORKSPACE/incoming/catalogue-4.0.4.py"
            python "$GITHUB_WORKSPACE/incoming/design-4.0.4.py"
            mkdir -p app/libs
            curl --fail --location --retry 3 --silent --show-error 'https://github.com/flow-vid/flowvid-ffmpeg-android/releases/download/v1.11.1-1/flowvid-media3-ffmpeg-v1.11.1-1.aar' -o app/libs/flowvid-media3-ffmpeg.aar
            echo '358bb85ae901d4245bb666becc1059a3ee8be138e16db9d3f6f19f5fde002c2c  app/libs/flowvid-media3-ffmpeg.aar' | sha256sum -c -
            unzip -tq app/libs/flowvid-media3-ffmpeg.aar
            grep -F 'orElse("4.0.4")' app/build.gradle.kts >/dev/null
            python "$GITHUB_WORKSPACE/incoming/preview-stability-next.py"
            grep -F 'orElse("4.0.5")' app/build.gradle.kts >/dev/null
            # Validate unified player source, including all SafePlayer call sites.
            python "$GITHUB_WORKSPACE/incoming/automatic-playback-4.0.6.py"
            grep -F 'orElse("4.0.6")' app/build.gradle.kts >/dev/null
            python "$GITHUB_WORKSPACE/incoming/native-buffer-4.0.7.py"
            grep -F 'orElse("4.0.7")' app/build.gradle.kts >/dev/null
            python - <<'PY'
          from pathlib import Path
          import re
          p=Path("app/build.gradle.kts")
          s=p.read_text()
          s,n=re.subn(r'(\bmedia3Version\s*=\s*)"1\.11\.1"',r'\g<1>"1.12.0-beta01"',s)
          assert n==1, "Stable Media3 version declaration not found"
          assert s.count('orElse("40007")')==1 and s.count('orElse("4.0.7")')==1
          s=s.replace('orElse("40007")','orElse("40008")').replace('orElse("4.0.7")','orElse("4.0.8")')
          assert 'applicationId = "com.example.xtreamtv"' in s
          p.write_text(s)
          print("Media3 1.12.0-beta01 selected; stable application ID retained")
          PY
            grep -F 'orElse("4.0.8")' app/build.gradle.kts >/dev/null
            # Preview-only unavailable-channel feedback and remote OK retry.
            python - <<'PY'
          from pathlib import Path
          import re
          p=Path("app/src/main/java/com/example/xtreamtv/MainActivity.kt")
          s=p.read_text()
          def swap(s,a,b):
              assert s.count(a)==1, "Unexpected 4.0.8 source: "+a[:120]
              return s.replace(a,b,1)
          s=swap(s,'    var preview by remember(api) { mutableStateOf<Entry?>(null) }','''    var preview by remember(api) { mutableStateOf<Entry?>(null) }
              var previewFailed by remember(api, preview?.id) { mutableStateOf(false) }
              var previewRetry by remember(api, preview?.id) { mutableIntStateOf(0) }''')
          s,n=re.subn(r'if\(previewEnabled && api!=null && preview\?\.id!=channel\.id\) preview=channel\s*\n\s*else onPlay\(channel\)','''if(previewEnabled && api!=null && preview?.id!=channel.id) preview=channel
                                      else if(previewEnabled && api!=null && previewFailed) {
                                          previewFailed=false
                                          previewRetry++
                                      } else onPlay(channel)''',s)
          assert n==1, "Channel OK action not found"
          # The archive uses a different wrapper around LivePreview than the repository source.
          # Find the invocation itself and preserve all original arguments and surrounding layout.
          start=s.index('@Composable private fun LivePreview(')
          calls=list(re.finditer(r'\bLivePreview\(',s[:start]))
          assert len(calls)==1, "Expected one LivePreview invocation; found "+str(len(calls))
          a=calls[0].start()
          opening=calls[0].end()-1
          depth=1
          i=opening+1
          quote=None
          escaped=False
          while i<len(s) and depth:
              ch=s[i]
              if quote:
                  if escaped: escaped=False
                  elif ch=='\\': escaped=True
                  elif ch==quote: quote=None
              elif ch in ('"', "'"): quote=ch
              elif ch=='(': depth+=1
              elif ch==')': depth-=1
              i+=1
          assert depth==0, "Unbalanced LivePreview invocation"
          args=s[opening+1:i-1].rstrip().rstrip(',')
          s=s[:a]+'key(previewRetry) { LivePreview('+args+', onFailureChange = { previewFailed=it }) }'+s[i:]
          n=1
          assert n==1, "Preview call not found"
          start=s.index('@Composable private fun LivePreview(')
          end=s.find('\n@Composable',start+1)
          if end<0: end=len(s)
          before,part,after=s[:start],s[start:end],s[end:]
          part=swap(part,'fun LivePreview(url:String)', 'fun LivePreview(url:String,onFailureChange:(Boolean)->Unit)')
          part=swap(part,'    var failed by remember(url){mutableStateOf(false)}','''    var failed by remember(url){mutableStateOf(false)}
              var renderedFrame by remember(url){mutableStateOf(false)}
              LaunchedEffect(failed) { onFailureChange(failed) }''')
          part=swap(part,'    DisposableEffect(player,url) {','''    LaunchedEffect(player,url) {
                  delay(20_000L)
                  if(!renderedFrame) failed=true
              }
              DisposableEffect(player,url) {''')
          part=swap(part,'            override fun onPlaybackStateChanged(state:Int) {','''            override fun onRenderedFirstFrame() {
                          renderedFrame=true
                          failed=false
                      }
                      override fun onPlaybackStateChanged(state:Int) {''')
          # Draw an opaque error overlay above the existing preview surface; keep normal playback unchanged.
          part,n=re.subn(r'if\s*\(failed\)\s*Text\([^\n]+', 'if(failed) Text("Channel unavailable — Press OK to retry", color=Color.White, fontSize=13.sp, modifier=Modifier.align(Alignment.Center).background(Color.Black).padding(12.dp))',part)
          assert n==1, "Existing preview failure label not found"
          s=before+part+after
          # Extend the already-tested account-scoped disk cache to Live TV.
          # Keep the same refresh rules and channel selection; cached data is provisional.
          s=swap(s,'''            if(catalogueKind!="live") {
                          a.cachedCategories(action)?.takeIf { it.isNotEmpty() }?.let {
                              categories=it
                              categoryId=it.first().first
                              categoriesLoading=false
                          }
                      }''','''            a.cachedCategories(action)?.takeIf { it.isNotEmpty() }?.let {
                          categories=it
                          if(categoryId==null || it.none { c -> c.first==categoryId }) categoryId=it.first().first
                          categoriesLoading=false
                      }''')
          s=swap(s,'''            if(catalogueKind!="live") {
                          a.cachedEntries(action,catalogueKind,id)?.takeIf { it.isNotEmpty() }?.let {
                              if(catalogueKind=="movie") movies=it else series=it
                              entriesLoading=false
                          }
                      }''','''            a.cachedEntries(action,catalogueKind,id)?.takeIf { it.isNotEmpty() }?.let {
                          when(catalogueKind) { "live" -> live=it; "movie" -> movies=it; else -> series=it }
                          entriesLoading=false
                      }''')
          # De-duplicate only once per channel list, rather than on every search keystroke.
          old='val filtered=remember(channels,query){channels.distinctBy { it.id }.filter { it.title.contains(query,true) }}'
          if s.count(old)==1:
              s=s.replace(old,'''val uniqueChannels=remember(channels) { channels.distinctBy { it.id } }
              val filtered=remember(uniqueChannels,query) { if(query.isBlank()) uniqueChannels else uniqueChannels.filter { it.title.contains(query,true) } }''',1)
              print("Channel search de-duplication moved outside per-query filtering")
          else:
              print("Channel search already differs from baseline; left unchanged")
          p.write_text(s)
          p=Path("app/build.gradle.kts")
          s=p.read_text()
          s=swap(s,'orElse("40008")','orElse("40009")')
          s=swap(s,'orElse("4.0.8")','orElse("4.0.9")')
          assert 'media3Version = "1.12.0-beta01"' in s
          p.write_text(s)
          print("Preview error feedback, live cache-first loading and OK retry applied; Media3 and buffering unchanged")
          PY
            grep -F 'orElse("4.0.9")' app/build.gradle.kts >/dev/null
            # Dedicated TV catalogue browser; leave the two Home landscape rows untouched.
            python - <<'PY'
          from pathlib import Path
          p=Path("app/src/main/java/com/example/xtreamtv/MainActivity.kt")
          s=p.read_text()
          def swap(s,a,b):
              assert s.count(a)==1, "Unexpected catalogue UI source: "+a[:120]
              return s.replace(a,b,1)
          s=swap(s,'import androidx.compose.foundation.lazy.LazyColumn','''import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.grid.LazyVerticalGrid
          import androidx.compose.foundation.lazy.grid.GridCells
          import androidx.compose.foundation.lazy.grid.items as gridItems
          import androidx.compose.foundation.lazy.grid.rememberLazyGridState''')
          # Find the catalogue box using stable inner marker and actual indentation.
          import re
          marker=s.index('val firstRow=remember(sectionEntries)')
          matches=list(re.finditer(r'(?m)^([ ]*)if\s*\(sectionEntries\.isNotEmpty\(\)\)\s*BoxWithConstraints\s*\(',s[:marker]))
          assert matches, "Could not locate catalogue box"
          match=matches[-1]
          start=match.start()
          end=re.search(r'(?m)^'+re.escape(match.group(1))+r'\}[ \t]*$',s[marker:])
          assert end, "Could not locate catalogue box end"
          stop=marker+end.end()
          old=s[start:stop]
          assert 'val firstRow=remember(sectionEntries)' in old and 'V4PosterRow(' in old, "Unexpected old catalogue rows"
          s=s[:start]+'''                                if(connected) TvCatalogueBrowser(
                                              modifier=Modifier.weight(1f).fillMaxWidth(),
                                              categories=categories, categoryId=categoryId, entries=sectionEntries,
                                              loading=catalogueLoading, onCategory={ categoryId=it },
                                              onRetry={scope.launch { api?.clearCatalogueCache();catalogueRetry++ }},
                                              onSelect={openTitle(it)}
                                          )'''+s[stop:]
          # Remove the duplicate category popup control; the new sidebar remains visible.
