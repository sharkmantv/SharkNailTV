                      android.util.Log.d("SharkPlaybackStats", "preview="+preview+" startupMs="+stats.meanJoinTimeMs+
                          " rebufferCount="+stats.totalRebufferCount+" droppedFrames="+stats.totalDroppedFrames)
                  })
          ''')
          s=''.join(lines)
          # Optional hardware experiments: never enable additional decoders by default.
          marker='    return ExoPlayer.Builder('
          assert s.count(marker)==1
          s=s.replace(marker,'''    val experimentalTunneling = !preview && p.getBoolean("sharkTunneling",false)
              val trackSelector = androidx.media3.exoplayer.trackselection.DefaultTrackSelector(context.applicationContext)
              trackSelector.setParameters(trackSelector.buildUponParameters().setTunnelingEnabled(experimentalTunneling).build())
              if (!preview && !live && p.getBoolean("sharkPrewarm",false)) {
                  factory.experimentalSetEnableMediaCodecVideoRendererPrewarming(true)
              }
              val networkFactory: androidx.media3.datasource.DataSource.Factory = if (!preview && p.getBoolean("sharkCronet",false)) {
                  sharkCronetFactory(context) ?: androidx.media3.datasource.okhttp.OkHttpDataSource.Factory(sharkPlaybackHttp)
              } else androidx.media3.datasource.okhttp.OkHttpDataSource.Factory(sharkPlaybackHttp)
              return ExoPlayer.Builder(''',1)
          s=swap(s,'.setLoadControl(load).setMediaSourceFactory(','.setTrackSelector(trackSelector).setLoadControl(load).setMediaSourceFactory(')
          # Only replace the data-source argument in the player builder, not the fallback above.
          s=swap(s,'.setDataSourceFactory(androidx.media3.datasource.DefaultDataSource.Factory(context.applicationContext, androidx.media3.datasource.okhttp.OkHttpDataSource.Factory(sharkPlaybackHttp)))','.setDataSourceFactory(androidx.media3.datasource.DefaultDataSource.Factory(context.applicationContext, networkFactory))')
          s += '''
          // Reuse one optional Cronet engine; do not load extra native networking binaries.
          private val sharkCronetExecutor by lazy { java.util.concurrent.Executors.newSingleThreadExecutor() }
          private var sharedSharkCronet: org.chromium.net.CronetEngine? = null
          @Synchronized private fun sharkCronetFactory(context: Context): androidx.media3.datasource.DataSource.Factory? {
              return try {
                  val engine = sharedSharkCronet ?: androidx.media3.datasource.cronet.CronetUtil.buildCronetEngine(context.applicationContext)?.also { sharedSharkCronet=it }
                  if (engine == null) {
                      android.util.Log.d("SharkPlaybackStats","Cronet provider unavailable; using OkHttp")
                      null
                  } else androidx.media3.datasource.cronet.CronetDataSource.Factory(engine, sharkCronetExecutor)
                      .setConnectionTimeoutMs(10_000).setReadTimeoutMs(20_000)
              } catch (_: Exception) { null } catch (_: LinkageError) { null }
          }
          '''
          # Experimental options live beside decoder fallback in Playback & Display.
          anchor='                PremiumButton(compact=true,onClick={fallback=!fallback;'
          assert s.count(anchor)==1, "Decoder fallback button missing"
          s=s.replace(anchor,'                SharkExperimentalPlaybackOptions(p)\n'+anchor,1)
          s += '''
          @Composable private fun SharkExperimentalPlaybackOptions(p: android.content.SharedPreferences) {
              Text("Advanced playback · experimental",color=Color.White,fontSize=12.sp)
              listOf("sharkTunneling" to "Hardware tunneling","sharkPrewarm" to "VOD decoder prewarming","sharkCronet" to "Cronet networking").forEach { (key,title) ->
                  var enabled by remember(key) { mutableStateOf(p.getBoolean(key,false)) }
                  PremiumButton(compact=true,onClick={enabled=!enabled;p.edit().putBoolean(key,enabled).apply()},modifier=Modifier.fillMaxWidth()) {
                      Text(title+": "+if(enabled) "On" else "Off")
                  }
              }
              Text("Restart playback after changing. Keep off if a stream fails.",color=Color.LightGray,fontSize=11.sp)
          }
          '''
          p.write_text(s)
          p=Path("app/src/main/java/com/example/xtreamtv/MainActivity.kt")
          s=p.read_text()
          # Coalesce same-channel EPG requests; existing bounded per-account cache remains.
          anchor='    suspend fun epg(streamId:String):List<Program>'
          assert s.count(anchor)==1
          s=s.replace(anchor,'''    private val epgRequestLocks=Array(16) { kotlinx.coroutines.sync.Mutex() }
              suspend fun epg(streamId:String):List<Program> = epgRequestLocks[(streamId.hashCode() and Int.MAX_VALUE)%epgRequestLocks.size].withLock {
                  fetchEpgUncoalesced(streamId)
              }
              private suspend fun fetchEpgUncoalesced(streamId:String):List<Program>''',1)
          if 'import kotlinx.coroutines.sync.withLock' not in s:
              s=s.replace('import kotlinx.coroutines.', 'import kotlinx.coroutines.sync.withLock\nimport kotlinx.coroutines.',1)
          p.write_text(s)
          p=Path("app/build.gradle.kts")
          s=p.read_text()
          # Use a stable engine exactly matching the shipped, SHA-verified FFmpeg AAR.
          s=swap(s,'media3Version = "1.12.0-beta01"','media3Version = "1.11.1"')
          s=swap(s,'    implementation("androidx.media3:media3-datasource-okhttp:$media3Version")','    implementation("androidx.media3:media3-datasource-okhttp:$media3Version")\n    implementation("androidx.media3:media3-datasource-cronet:$media3Version")')
          s=swap(s,'orElse("40009")','orElse("40115")')
          s=swap(s,'orElse("4.0.9")','orElse("4.1.15")')
          p.write_text(s)
          print("Movies and TV Series use a lazy poster grid, persistent sidebar, title search and sorting. Home unchanged.")
          PY
            python "$GITHUB_WORKSPACE/incoming/preload-4.1.11.py"
            python "$GITHUB_WORKSPACE/incoming/room-catalogue-4.1.11.py"
            # Seed baseline rules for the known startup path. Actual device benchmarks remain required.
            mkdir -p app/src/main
            cat > app/src/main/baseline-prof.txt <<'PROFILE'
          Lcom/example/xtreamtv/MainActivity;
          HSPLcom/example/xtreamtv/MainActivity;->onCreate(Landroid/os/Bundle;)V
          Lcom/example/xtreamtv/PlaybackSettingsKt;
          Lcom/example/xtreamtv/CatalogueDatabase;
          PROFILE
            python - <<'PY'
          from pathlib import Path
          p=Path("app/build.gradle.kts")
          s=p.read_text()
          assert s.count("dependencies {")==1
          s=s.replace("dependencies {",'dependencies {\n    implementation("androidx.profileinstaller:profileinstaller:1.4.1")',1)
          p.write_text(s)
          PY
            python "$GITHUB_WORKSPACE/incoming/performance-audit-4.1.12.py"
            python "$GITHUB_WORKSPACE/incoming/playback-performance-4.1.13.py"
            python "$GITHUB_WORKSPACE/incoming/home-performance-4.1.14.py"
            python "$GITHUB_WORKSPACE/incoming/player-ui-4.1.15.py"
            grep -F 'orElse("4.1.15")' app/build.gradle.kts >/dev/null
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 37
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f -print -quit)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" 'platforms;android-37.0' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Build matching AV1 and VP9 native decoder extensions
        if: env.SOURCE_ZIP != ''
        run: bash "$GITHUB_WORKSPACE/incoming/build-video-decoders-4.1.11.sh"
      - name: Prepare version and optional signing
        env:
          SHARK_KEYSTORE_B64: ${{ secrets.SHARK_KEYSTORE_B64 }}
          SHARK_SIGNING_BUNDLE: ${{ secrets.SHARK_SIGNING_BUNDLE }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          floor=30000
          if [[ -n "${SOURCE_ZIP:-}" ]]; then floor=40114; fi
          code=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name' |
            python -c 'import re,sys; versions = [tuple(map(int, m.groups(default="0"))) for line in sys.stdin if (m := re.fullmatch(r"v?(\d{1,2})\.(\d{1,2})(?:\.(\d{1,2}))?", line.strip()))]; print(max([int(sys.argv[1])] + [a*10000+b*100+c for a,b,c in versions]) + 1)' "$floor")
          version="$((code / 10000)).$((code / 100 % 100)).$((code % 100))"
          printf 'VERSION_CODE=%s\nVERSION_NAME=%s\n' "$code" "$version" >> "$GITHUB_ENV"
          if [[ -n "$SHARK_KEYSTORE_B64" ]]; then
            umask 077
            printf '%s' "$SHARK_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/shark-updates.jks"
            printf 'SHARK_KEYSTORE_PATH=%s\n' "$RUNNER_TEMP/shark-updates.jks" >> "$GITHUB_ENV"
          elif [[ -z "$SHARK_SIGNING_BUNDLE" ]]; then
            echo 'OTA signing key is unavailable. This run will produce a debug APK.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Build installable APK
        env:
          SHARK_SIGNING_BUNDLE: ${{ secrets.SHARK_SIGNING_BUNDLE }}
          SHARK_KEYSTORE_PASSWORD: ${{ secrets.SHARK_KEYSTORE_PASSWORD }}
          SHARK_KEY_ALIAS: ${{ secrets.SHARK_KEY_ALIAS }}
          SHARK_KEY_PASSWORD: ${{ secrets.SHARK_KEY_PASSWORD }}
          SPORTS_API_KEY: ${{ secrets.SPORTS_API_KEY }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"
          if [[ -n "$TMDB_API_KEY" ]]; then
            printf 'TMDB_API_KEY=%s\n' "$TMDB_API_KEY" > tmdb.properties
          elif [[ ! -f tmdb.properties && -f "$GITHUB_WORKSPACE/tmdb.properties" ]]; then
            cp "$GITHUB_WORKSPACE/tmdb.properties" tmdb.properties
          fi
          if [[ -n "${SOURCE_ZIP:-}" ]]; then test -s tmdb.properties; fi
          if [[ -n "$SPORTS_API_KEY" ]]; then printf 'SPORTS_API_KEY=%s\n' "$SPORTS_API_KEY" > sports.properties; fi
          if [[ -n "$SHARK_SIGNING_BUNDLE" ]]; then
            export SHARK_KEYSTORE_PATH="$RUNNER_TEMP/sharknailtv.p12"
            umask 077
            SHARK_KEYSTORE_PASSWORD=$(python - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path

          bundle = json.loads(os.environ['SHARK_SIGNING_BUNDLE'].strip(), strict=False)
          key = ''.join(bundle['keystore'].split())
          Path(os.environ['SHARK_KEYSTORE_PATH']).write_bytes(base64.b64decode(key, validate=True))
          print(''.join(bundle['password'].split()))
          PY
            )
            echo "::add-mask::$SHARK_KEYSTORE_PASSWORD"
            export SHARK_KEYSTORE_PASSWORD
            export SHARK_KEY_PASSWORD="$SHARK_KEYSTORE_PASSWORD"
            export SHARK_KEY_ALIAS=sharknailtv
          fi
          unset SHARK_SIGNING_BUNDLE
          if [[ -z "${SHARK_KEYSTORE_PATH:-}" ]]; then
            if [[ "$GITHUB_EVENT_NAME" == push ]]; then echo "::error::Permanent signing key missing"; exit 1; fi
            gradle --no-daemon :app:assembleDebug -PSHARK_VERSION_CODE="$VERSION_CODE" -PSHARK_VERSION_NAME="$VERSION_NAME"
            cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/SharkNailTV-debug.apk"
            exit 0
          fi
          : "${SHARK_KEYSTORE_PASSWORD:?Missing SHARK_KEYSTORE_PASSWORD}"
          : "${SHARK_KEY_ALIAS:?Missing SHARK_KEY_ALIAS}"
          : "${SHARK_KEY_PASSWORD:?Missing SHARK_KEY_PASSWORD}"
          gradle --no-daemon :app:assembleRelease -PSHARK_VERSION_CODE="$VERSION_CODE" -PSHARK_VERSION_NAME="$VERSION_NAME"
          gradle --no-daemon :macrobenchmark:assembleBenchmark -PSHARK_VERSION_CODE="$VERSION_CODE" -PSHARK_VERSION_NAME="$VERSION_NAME"
          mkdir -p "$GITHUB_WORKSPACE/performance-audit"
          gradle --no-daemon :app:dependencies --configuration releaseRuntimeClasspath > "$GITHUB_WORKSPACE/performance-audit/release-dependencies.txt"
          find macrobenchmark/build/outputs/apk -name '*.apk' -exec cp {} "$GITHUB_WORKSPACE/performance-audit/" \;
          test -n "$(find "$GITHUB_WORKSPACE/performance-audit" -name '*.apk' -print -quit)"
          tools="$ANDROID_HOME/build-tools/36.0.0"
          shopt -s nullglob
          apks=(app/build/outputs/apk/release/*.apk)
          [[ ${#apks[@]} == 1 ]]
          "$tools/zipalign" -P 16 -f 4 "${apks[0]}" "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" sign --ks "$SHARK_KEYSTORE_PATH" --ks-key-alias "$SHARK_KEY_ALIAS" --ks-pass env:SHARK_KEYSTORE_PASSWORD --key-pass env:SHARK_KEY_PASSWORD --out "$GITHUB_WORKSPACE/SharkNailTV.apk" "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" verify --print-certs "$GITHUB_WORKSPACE/SharkNailTV.apk"
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            cert=$("$tools/apksigner" verify --print-certs "$GITHUB_WORKSPACE/SharkNailTV.apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
            [[ "$cert" == "14fea534b29f1196c0a2fcb0618cde8f6391ad6e9153a941fd8c86e3cb0fca96" ]] || { echo "::error::Signing certificate does not match installed 3.4.8"; exit 1; }
          fi
          badging=$("$tools/aapt" dump badging "$GITHUB_WORKSPACE/SharkNailTV.apk")
          [[ "$badging" == *"package: name='com.example.xtreamtv' versionCode='$VERSION_CODE'"* ]]
      - uses: actions/upload-artifact@v4
        with:
          name: SharkNailTV-APK
          path: SharkNailTV*.apk
          if-no-files-found: error

      - name: Verify complete 4.1.15 package and matching FFmpeg fallback
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          test "$VERSION_NAME" = "4.1.15"
          test -f "$SOURCE_DIR/app/src/main/res/layout/shark_sdr_player.xml"
          grep -F 'EXTENSION_RENDERER_MODE_ON' "$SOURCE_DIR/app/src/main/java/com/example/xtreamtv/PlaybackSettings.kt"
          grep -F 'implementation(files("libs/flowvid-media3-ffmpeg.aar"))' "$SOURCE_DIR/app/build.gradle.kts"
          python - <<'PY'
          import os
          from zipfile import ZipFile
          with ZipFile(os.path.join(os.environ['GITHUB_WORKSPACE'],'SharkNailTV.apk')) as apk:
              assert apk.testzip() is None, "APK ZIP integrity failure"
              files = set(apk.namelist())
              for abi in ('arm64-v8a','armeabi-v7a','x86','x86_64'):
                  assert 'lib/'+abi+'/libffmpegJNI.so' in files, "Missing FFmpeg for "+abi
              assert 'assets/ffmpeg-source-notice.txt' in files
              for abi in ('arm64-v8a','armeabi-v7a','x86','x86_64'):
                  assert 'lib/'+abi+'/libdav1dJNI.so' in files, "Missing AV1 for "+abi
                  assert 'lib/'+abi+'/libvpxV2JNI.so' in files, "Missing VP9 JNI for "+abi
                  assert 'lib/'+abi+'/libvpx.so' in files, "Missing VP9 library for "+abi
              dex=b"".join(apk.read(f) for f in files if f.startswith('classes') and f.endswith('.dex'))
              assert b'LibvpxVideoRenderer' in dex, "VP9 renderer missing"
              assert b'Libdav1dVideoRenderer' in dex, "AV1 renderer missing"
              assert 'assets/decoder-licenses/SOURCES.txt' in files
              assert any(b'FfmpegAudioRenderer' in apk.read(f) for f in files if f.startswith('classes') and f.endswith('.dex')), "FFmpeg renderer missing from DEX"
          print('Native decoder ABIs, DEX, licensing notices and APK integrity verified')
          PY
      - name: Audit signed APK contents
        if: github.event_name == 'push'
        run: |
          python - <<'PY'
          import os, json
          from collections import Counter
          from pathlib import Path
          from zipfile import ZipFile
          root=Path(os.environ["GITHUB_WORKSPACE"])
          with ZipFile(root/"SharkNailTV.apk") as z:
              rows=z.infolist()
              assert not any(n>1 for n in Counter(x.filename for x in rows).values()), "Duplicate APK entries"
              assert z.testzip() is None
              report={"apk_bytes":(root/"SharkNailTV.apk").stat().st_size,"native_libraries":sorted(x.filename for x in rows if x.filename.startswith("lib/")),"largest_entries":[{"file":x.filename,"bytes":x.file_size} for x in sorted(rows,key=lambda x:x.file_size,reverse=True)[:40]]}
              assert not any("macrobenchmark" in x.filename for x in rows), "Benchmark should not ship in app"
              (root/"performance-audit/apk-contents.json").write_text(json.dumps(report,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: SharkNailTV-performance-audit
          path: performance-audit/
          if-no-files-found: error
      - name: Install and launch signed APK on Android emulator
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f -print -quit)"
          "$sdkmanager" "emulator" "platform-tools" "system-images;android-35;google_apis;x86_64"
          avdmanager="$(find "$ANDROID_HOME/cmdline-tools" -name avdmanager -type f -print -quit)"
          export ANDROID_USER_HOME="$RUNNER_TEMP/shark-android"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$avdmanager" create avd --force -n shark-smoke -p "$ANDROID_AVD_HOME/shark-smoke.avd" -k "system-images;android-35;google_apis;x86_64"
          test -s "$ANDROID_AVD_HOME/shark-smoke.avd/config.ini"
          # Explicitly write the discovery record, independent of avdmanager's user-home selection.
          printf 'avd.ini.encoding=UTF-8\npath=%s\npath.rel=avd/shark-smoke.avd\ntarget=android-35\n' "$ANDROID_AVD_HOME/shark-smoke.avd" > "$ANDROID_AVD_HOME/shark-smoke.ini"
          "$ANDROID_HOME/emulator/emulator" -list-avds | grep -Fx shark-smoke
          if [[ -e /dev/kvm ]]; then sudo chmod a+rw /dev/kvm; fi
          adb="$ANDROID_HOME/platform-tools/adb"
          emulator="$ANDROID_HOME/emulator/emulator"
          "$adb" start-server
          "$emulator" -accel-check || true
          accel=off
          if [[ -r /dev/kvm && -w /dev/kvm ]] && "$emulator" -accel-check >/dev/null 2>&1; then accel=on; fi
          echo "Emulator acceleration: $accel"
          "$emulator" -avd shark-smoke -port 5554 -accel "$accel" -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader -memory 2048 -verbose > "$RUNNER_TEMP/emulator.log" 2>&1 &
          emu_pid=$!
          trap 'result=$?; tail -100 "$RUNNER_TEMP/emulator.log" || true; kill "$emu_pid" 2>/dev/null || true; exit "$result"' EXIT
          export ANDROID_SERIAL=emulator-5554
          ready=false
          for i in $(seq 1 180); do
            if ! kill -0 "$emu_pid" 2>/dev/null; then echo "::error::Emulator process exited before boot"; exit 1; fi
            if [[ "$(timeout 8 "$adb" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)" == "1" ]]; then ready=true; break; fi
            sleep 5
          done
          test "$ready" = true || { echo "::error::Emulator boot timed out"; exit 1; }
          "$adb" shell input keyevent 82
          "$adb" install -r "$GITHUB_WORKSPACE/SharkNailTV.apk"
          "$adb" logcat -c
          "$adb" shell am start -W -n com.example.xtreamtv/.MainActivity
          sleep 12
          "$adb" shell pidof com.example.xtreamtv
          "$adb" shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity' | grep 'com.example.xtreamtv'
          "$adb" logcat -d -b crash > "$RUNNER_TEMP/shark-crash.log"
          if grep -F 'Process: com.example.xtreamtv' "$RUNNER_TEMP/shark-crash.log"; then
            cat "$RUNNER_TEMP/shark-crash.log"
            exit 1
          fi
          echo 'Signed APK installed and launched without a detected application crash.'
      - name: Publish signed ZIP OTA
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.SHARK_OTA_RELEASE_TOKEN || github.token }}
          OTA_TOKEN_CONFIGURED: ${{ secrets.SHARK_OTA_RELEASE_TOKEN != '' }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          test -f SharkNailTV.apk
          test -n "${SOURCE_ZIP:-}"
          test "${VERSION_CODE:?}" -ge 40000
          # Never publish a superseded candidate, including when an OTA token is configured.
          git fetch --no-tags origin main
          if ! git diff --quiet "$GITHUB_SHA" FETCH_HEAD -- incoming .github/workflows; then
            echo "::error::A newer source or workflow revision supersedes this candidate; refusing to publish."
            exit 1
          fi
          latest="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name')"
          if [[ "$latest" == "v$VERSION_NAME" ]]; then
            echo "::error::This version is already published; refusing to overwrite."
            exit 1
          fi
          python - <<'PY'
          import json, os
          from pathlib import Path
          tag = "v" + os.environ["VERSION_NAME"]
          url = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{tag}/SharkNailTV.apk"
          Path("update.json").write_text(json.dumps({"tag_name": tag, "draft": False, "prerelease": False, "assets": [{"name": "SharkNailTV.apk", "browser_download_url": url}]}), encoding="utf-8")
          PY
          gh release create "v$VERSION_NAME" SharkNailTV.apk update.json --target "$GITHUB_SHA" --title "SharkNailTV $VERSION_NAME" --notes "Consolidated 4.1.15: same-channel preview player handover with conventional fullscreen fallback; draw-only focus pulse, saved Live search, display-sized image decoding, persistent title index for refreshed catalogue snapshots; approved static Home graphics, saved screen positions, preview-native buffering and record-based SQLite cache; cache-first Xtream, Room and Paging catalogue, indexed search, TV focus restoration and fixed-size posters; matched Media3 1.11.1 FFmpeg/AV1/VP9 extensions; optional tunneling, Cronet, prewarming and next-channel PreloadManager; native fullscreen buffer, preview recovery, EPG coalescing and bounded failure backoff, bounded Room search and cached Paging browsing, safer standard D-pad focus and paging keys, low-memory preload guard, per-channel timing, startup profile, separate Macrobenchmark test APK, package/dependency audit and playback metrics. Signed APK, native library presence and emulator launch verified by CI. Actual provider/device playback, IBO comparison and performance benefits require device validation. Experimental playback features remain opt-in." --latest
