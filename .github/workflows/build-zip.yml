          # Privacy-safe session metrics; no URLs or credentials.
          p.write_text(s)
          p=Path("app/src/main/java/com/example/xtreamtv/PlaybackSettings.kt")
          s=p.read_text()
          lines=s.splitlines(keepends=True)
          builders=[n for n,line in enumerate(lines) if 'return ExoPlayer.Builder(' in line and '.build().apply {' in line]
          assert len(builders)==1, "Unexpected player builder"
