name: Build IBO SKY RETRO APK
on:
  pull_request:
    branches: [main]
    paths:
      - 'IBO_SKY_RETRO_5_0_TEST/**'
      - '.github/workflows/build-ibo-sky-retro-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 36
        shell: bash
        run: |
          SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then echo "Android SDK manager not found"; exit 1; fi
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build debug APK
        working-directory: IBO_SKY_RETRO_5_0_TEST
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: IBO-SKY-RETRO-5.0-test-APK
          path: IBO_SKY_RETRO_5_0_TEST/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
